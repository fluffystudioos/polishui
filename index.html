<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PolishUI — UI Style Reference</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root[data-theme="light"]{--bg:#fafafa;--bg-2:#fff;--bg-3:#f3f4f6;--hover:#f9fafb;--text:#111827;--text-2:#374151;--muted:#6b7280;--dim:#9ca3af;--border:#e5e7eb;--border-s:#d1d5db;--accent:#3b82f6;--accent-2:#2563eb;--glow:rgba(59,130,246,.15);--success:#10b981;--danger:#ef4444;--shadow:0 4px 12px rgba(0,0,0,.08);--shadow-lg:0 12px 30px rgba(0,0,0,.12);--canvas:#f3f4f6;--grid:rgba(0,0,0,.04)}
:root[data-theme="dark"]{--bg:#0a0a0b;--bg-2:#111114;--bg-3:#18181b;--hover:#1c1c20;--text:#f4f4f5;--text-2:#d4d4d8;--muted:#a1a1aa;--dim:#71717a;--border:rgba(255,255,255,.08);--border-s:rgba(255,255,255,.16);--accent:#60a5fa;--accent-2:#3b82f6;--glow:rgba(96,165,250,.2);--success:#34d399;--danger:#f87171;--shadow:0 4px 12px rgba(0,0,0,.4);--shadow-lg:0 12px 30px rgba(0,0,0,.5);--canvas:#0a0a0b;--grid:rgba(255,255,255,.04)}
*{margin:0;padding:0;box-sizing:border-box}html{background:var(--bg)}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;height:100vh;overflow:hidden;transition:background .3s,color .3s}
.topbar{height:56px;background:var(--bg-2);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 20px;gap:16px;z-index:100}
.brand{display:flex;align-items:center;gap:10px;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:16px;color:var(--text);text-decoration:none}
.brand-logo{width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,var(--accent),#8b5cf6);display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;box-shadow:0 4px 12px var(--glow)}
.brand .pro{color:var(--accent)}.tb-info{font-size:12px;color:var(--muted);font-weight:500;display:flex;align-items:center;gap:6px}
.tb-divider{width:1px;height:24px;background:var(--border)}.tb-actions{margin-left:auto;display:flex;align-items:center;gap:8px}
.icon-btn{width:36px;height:36px;border-radius:8px;border:1px solid var(--border);background:var(--bg-2);color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:13px;transition:all .15s}
.icon-btn:hover{background:var(--hover);color:var(--text);border-color:var(--border-s)}
.btn-ghost{padding:8px 14px;border-radius:8px;background:transparent;color:var(--text-2);border:1px solid var(--border);font-size:13px;font-weight:500;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:all .15s}
.btn-ghost:hover{background:var(--hover);border-color:var(--border-s)}
.workspace{display:grid;grid-template-columns:300px 1fr;height:calc(100vh - 56px)}
.sidebar{background:var(--bg-2);border-right:1px solid var(--border);overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--border-s) transparent}
.sidebar::-webkit-scrollbar{width:6px}.sidebar::-webkit-scrollbar-thumb{background:var(--border-s);border-radius:3px}
.search-wrap{padding:12px 14px 8px;position:sticky;top:0;background:var(--bg-2);z-index:5;border-bottom:1px solid var(--border)}
.search-input{width:100%;padding:9px 12px 9px 32px;border:1px solid var(--border);border-radius:8px;background:var(--bg-3);font-size:12px;color:var(--text);outline:none;transition:all .15s}
.search-input:focus{border-color:var(--accent);background:var(--bg-2)}
.search-wrap{position:relative}.search-wrap i.search-icon{position:absolute;left:24px;top:50%;transform:translateY(-50%);color:var(--dim);font-size:11px;pointer-events:none}
.sb-header{padding:14px 18px 8px;display:flex;align-items:center;justify-content:space-between}
.sb-header h3{font-family:'Space Grotesk',sans-serif;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted)}
.sb-header .count{font-size:10px;color:var(--dim);font-family:'JetBrains Mono',monospace}
.category-tabs{display:grid;grid-template-columns:repeat(2,1fr);gap:5px;padding:4px 14px 14px}
.cat-tab{display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 4px;border:1px solid var(--border);background:var(--bg-2);border-radius:8px;cursor:pointer;transition:all .15s;color:var(--text-2)}
.cat-tab:hover{background:var(--hover);border-color:var(--border-s)}
.cat-tab.active{background:var(--accent);color:#fff;border-color:var(--accent);box-shadow:0 4px 12px var(--glow)}
.cat-tab .cat-emoji{font-size:16px}.cat-tab .cat-name{font-size:10px;font-weight:600;font-family:'Space Grotesk',sans-serif}
.cat-tab.special{background:linear-gradient(135deg,#fbbf24,#f59e0b);color:#fff;border-color:transparent}
.cat-tab.special.active{background:linear-gradient(135deg,#fbbf24,#f59e0b);box-shadow:0 4px 12px rgba(251,191,36,.4)}
.materials-section{padding:4px 14px 20px}
.materials-section h4{font-family:'Space Grotesk',sans-serif;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted);margin-bottom:10px;padding-left:4px;display:flex;justify-content:space-between;align-items:center}
.material-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}
.material-card{cursor:pointer;border-radius:9px;overflow:hidden;border:1px solid var(--border);background:var(--bg-2);transition:all .2s cubic-bezier(.16,1,.3,1);position:relative}
.material-card:hover{transform:translateY(-2px);border-color:var(--border-s);box-shadow:var(--shadow)}
.material-card.selected{border-color:var(--accent);box-shadow:0 0 0 2px var(--glow),var(--shadow)}
.material-preview{height:56px;width:100%}
.material-name{padding:5px 7px;font-size:10px;font-weight:600;color:var(--text-2);text-align:center;font-family:'Space Grotesk',sans-serif;background:var(--bg-2);border-top:1px solid var(--border)}
.material-card.selected .material-name{color:var(--accent)}
.fav-btn{position:absolute;top:4px;right:4px;width:22px;height:22px;border-radius:50%;background:rgba(0,0,0,.5);border:none;color:#fff;cursor:pointer;font-size:10px;display:flex;align-items:center;justify-content:center;opacity:0;transition:all .15s;backdrop-filter:blur(8px)}
.material-card:hover .fav-btn,.fav-btn.fav-on{opacity:1}
.fav-btn.fav-on{background:#fbbf24}
.empty-state{padding:30px 16px;text-align:center;color:var(--dim);font-size:11px}
.empty-state i{font-size:24px;display:block;margin-bottom:8px;opacity:.5}
.main{display:grid;grid-template-rows:auto 1fr auto;overflow:hidden}
.canvas-wrap{background:var(--canvas);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px;display:flex;align-items:center;justify-content:center;padding:30px;overflow:auto;position:relative;transition:background .3s}
.canvas-wrap.bg-white{background:#fff;background-image:none}.canvas-wrap.bg-black{background:#000;background-image:none}
.canvas-wrap.bg-checker{background:#fff;background-image:linear-gradient(45deg,#ddd 25%,transparent 25%),linear-gradient(-45deg,#ddd 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#ddd 75%),linear-gradient(-45deg,transparent 75%,#ddd 75%);background-size:20px 20px;background-position:0 0,0 10px,10px -10px,-10px 0}
#preview-element{display:flex;align-items:center;justify-content:center;font-family:'Inter',sans-serif;font-weight:700;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.2);transition:all .3s ease;position:relative}
.preview-empty{color:var(--dim);font-size:14px;text-align:center;padding:60px;background:none!important;box-shadow:none!important;border:none!important}
.preview-empty i{font-size:40px;display:block;margin-bottom:12px;opacity:.4}
.controls-bar{padding:10px 16px;background:var(--bg-2);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.element-tabs{display:flex;gap:3px;background:var(--bg-3);padding:3px;border-radius:7px;border:1px solid var(--border)}
.elem-tab{padding:5px 9px;border-radius:5px;border:none;background:transparent;color:var(--muted);font-size:11px;font-weight:500;cursor:pointer;transition:all .15s;display:flex;align-items:center;gap:5px}
.elem-tab:hover{color:var(--text)}.elem-tab.active{background:var(--bg-2);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.05)}
.bg-tabs{display:flex;gap:3px;background:var(--bg-3);padding:3px;border-radius:7px;border:1px solid var(--border)}
.bg-tab{width:26px;height:26px;border-radius:4px;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--muted);background:transparent;transition:all .15s}
.bg-tab:hover{color:var(--text)}.bg-tab.active{background:var(--bg-2);color:var(--accent);box-shadow:0 1px 2px rgba(0,0,0,.05)}
.color-pick-wrap{display:flex;align-items:center;gap:6px;padding:4px 10px;border:1px solid var(--border);background:var(--bg-3);border-radius:7px}
.color-pick-wrap label{font-size:10px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.color-pick-wrap input[type="color"]{width:24px;height:24px;border:none;padding:0;background:transparent;cursor:pointer;border-radius:5px}
.color-pick-wrap input[type="color"]::-webkit-color-swatch-wrapper{padding:0}
.color-pick-wrap input[type="color"]::-webkit-color-swatch{border:1px solid var(--border-s);border-radius:5px}
.color-pick-wrap .reset{background:none;border:none;color:var(--dim);cursor:pointer;font-size:10px;padding:2px 4px}
.color-pick-wrap .reset:hover{color:var(--danger)}
.hue-control{display:flex;align-items:center;gap:8px;flex:1;min-width:160px;max-width:280px;padding:0 10px;border:1px solid var(--border);background:var(--bg-3);border-radius:7px;height:32px}
.hue-control label{font-size:10px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.hue-slider{flex:1;-webkit-appearance:none;appearance:none;height:6px;border-radius:3px;outline:none;cursor:pointer;background:linear-gradient(to right,hsl(0,80%,60%),hsl(60,80%,60%),hsl(120,80%,60%),hsl(180,80%,60%),hsl(240,80%,60%),hsl(300,80%,60%),hsl(360,80%,60%))}
.hue-slider::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:#fff;cursor:pointer;border:2px solid var(--bg-2);box-shadow:0 2px 6px rgba(0,0,0,.25)}
.hue-val{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--text-2);min-width:32px;text-align:right;font-weight:600}
.action-btn{padding:6px 12px;border-radius:7px;border:1px solid var(--border);background:var(--bg-2);color:var(--text-2);font-size:11px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:all .15s}
.action-btn:hover{background:var(--accent);color:#fff;border-color:var(--accent);transform:translateY(-1px)}
.settings-panel{background:var(--bg-2);border-top:1px solid var(--border);max-height:42vh;overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--border-s) transparent}
.settings-panel::-webkit-scrollbar{width:6px}.settings-panel::-webkit-scrollbar-thumb{background:var(--border-s);border-radius:3px}
.settings-header{display:flex;align-items:center;justify-content:space-between;padding:14px 20px 10px;position:sticky;top:0;background:var(--bg-2);border-bottom:1px solid var(--border);z-index:10;flex-wrap:wrap;gap:10px}
.settings-title{display:flex;align-items:center;gap:10px}
.settings-title h3{font-family:'Space Grotesk',sans-serif;font-size:13px;font-weight:700}
.settings-title .style-name{font-size:11px;color:var(--muted);font-weight:500;padding:3px 10px;border-radius:999px;background:var(--bg-3);border:1px solid var(--border)}
.export-tabs{display:flex;gap:3px;background:var(--bg-3);padding:3px;border-radius:7px;border:1px solid var(--border)}
.export-tab{padding:6px 11px;border-radius:5px;border:none;background:transparent;color:var(--muted);font-size:11px;font-weight:600;cursor:pointer;transition:all .15s;display:flex;align-items:center;gap:5px}
.export-tab:hover{color:var(--text)}.export-tab.active{background:var(--bg-2);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.05)}
.settings-body{padding:14px 18px 18px}
.settings-block{margin-bottom:12px;background:var(--bg-3);border:1px solid var(--border);border-radius:9px;overflow:hidden}
.settings-block-header{display:flex;align-items:center;gap:8px;padding:9px 13px;background:var(--bg-2);border-bottom:1px solid var(--border);font-family:'Space Grotesk',sans-serif;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--text-2)}
.settings-block-header .block-icon{width:18px;height:18px;border-radius:4px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:8px}
.settings-block-body{padding:9px 13px;display:flex;flex-direction:column;gap:4px}
.settings-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:5px 0}
.settings-row+.settings-row{border-top:1px solid var(--border)}
.settings-row .key{font-size:11px;color:var(--muted);font-weight:500;min-width:80px}
.settings-row .value{display:flex;align-items:center;gap:7px;font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--text);font-weight:500;flex:1;justify-content:flex-end}
.color-chip{width:16px;height:16px;border-radius:4px;border:1px solid var(--border-s);flex-shrink:0}
.copy-btn{width:22px;height:22px;border-radius:5px;border:1px solid var(--border);background:var(--bg-2);color:var(--muted);cursor:pointer;font-size:9px;display:flex;align-items:center;justify-content:center;transition:all .15s}
.copy-btn:hover{background:var(--accent);color:#fff;border-color:var(--accent)}
.copy-btn.copied{background:var(--success);color:#fff;border-color:var(--success)}
.code-block{background:#0d1117;border:1px solid var(--border);border-radius:9px;padding:14px;font-family:'JetBrains Mono',monospace;font-size:12px;color:#d4d4d8;white-space:pre;overflow-x:auto;line-height:1.6;max-height:300px;overflow-y:auto}
.code-block .k{color:#79b8ff}.code-block .s{color:#9ecbff}.code-block .n{color:#ffab70}.code-block .c{color:#6a737d;font-style:italic}.code-block .p{color:#f97583}
.code-actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.code-btn{padding:8px 14px;border-radius:7px;background:var(--accent);color:#fff;border:none;font-size:12px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:all .15s}
.code-btn:hover{background:var(--accent-2);transform:translateY(-1px)}
.icon-fill{background:linear-gradient(135deg,#3b82f6,#8b5cf6)}.icon-stroke{background:linear-gradient(135deg,#10b981,#06b6d4)}.icon-effect{background:linear-gradient(135deg,#1f2937,#000)}.icon-corner{background:linear-gradient(135deg,#ec4899,#a855f7)}
.toast-stack{position:fixed;bottom:24px;right:24px;display:flex;flex-direction:column-reverse;gap:8px;z-index:9999;pointer-events:none}
.toast{background:var(--bg-2);border:1px solid var(--border);box-shadow:var(--shadow-lg);border-radius:10px;padding:12px 16px;display:flex;align-items:center;gap:10px;font-size:13px;font-weight:500;animation:slideIn .3s ease,fadeOut .3s 2s ease forwards;pointer-events:all}
@keyframes slideIn{from{transform:translateX(20px);opacity:0}to{transform:translateX(0);opacity:1}}
@keyframes fadeOut{to{opacity:0;transform:translateX(20px)}}
@media(max-width:900px){body{overflow:auto;height:auto}.workspace{grid-template-columns:1fr;height:auto}.sidebar{border-right:none;border-bottom:1px solid var(--border);max-height:none}.category-tabs{grid-template-columns:repeat(4,1fr)}.material-grid{grid-template-columns:repeat(3,1fr)}.controls-bar{flex-direction:column;align-items:stretch}.hue-control{width:100%;max-width:none}.canvas-wrap{min-height:280px;padding:20px}.settings-panel{max-height:none}}
@media(max-width:500px){.material-grid{grid-template-columns:repeat(2,1fr)}.element-tabs{overflow-x:auto}.elem-tab{white-space:nowrap}.category-tabs{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<header class="topbar">
<a href="#" class="brand"><div class="brand-logo"><i class="fa-solid fa-wand-magic-sparkles"></i></div><span>Polish<span class="pro">UI</span></span></a>
<div class="tb-divider"></div>
<span class="tb-info"><i class="fa-solid fa-bookmark"></i> <span id="total-count">0</span> styles</span>
<div class="tb-actions">
<button class="btn-ghost" onclick="randomStyle()"><i class="fa-solid fa-dice"></i> Random</button>
<button class="icon-btn" onclick="toggleTheme()" title="Theme"><i class="fa-regular fa-moon" id="themeIcon"></i></button>
</div>
</header>
<div class="workspace">
<aside class="sidebar">
<div class="search-wrap"><i class="fa-solid fa-magnifying-glass search-icon"></i><input type="text" class="search-input" id="search-input" placeholder="Search materials..."></div>
<div class="sb-header"><h3>Categories</h3></div>
<div class="category-tabs" id="category-tabs"></div>
<div class="materials-section"><h4><span id="materials-heading">Styles</span> <span class="count" id="mat-count"></span></h4><div class="material-grid" id="material-grid"></div></div>
</aside>
<main class="main">
<div class="controls-bar">
<div class="element-tabs" id="element-tabs">
<button class="elem-tab active" data-element="button"><i class="fa-solid fa-square"></i> Button</button>
<button class="elem-tab" data-element="card"><i class="fa-solid fa-id-card"></i> Card</button>
<button class="elem-tab" data-element="frame"><i class="fa-regular fa-square"></i> Frame</button>
<button class="elem-tab" data-element="panel"><i class="fa-solid fa-window-maximize"></i> Panel</button>
<button class="elem-tab" data-element="badge"><i class="fa-solid fa-certificate"></i> Badge</button>
<button class="elem-tab" data-element="container"><i class="fa-solid fa-box"></i> Container</button>
<button class="elem-tab" data-element="icon"><i class="fa-solid fa-circle"></i> Icon</button>
</div>
<div class="bg-tabs">
<button class="bg-tab active" data-bg="grid" title="Grid"><i class="fa-solid fa-border-all"></i></button>
<button class="bg-tab" data-bg="white" title="White"><i class="fa-regular fa-sun"></i></button>
<button class="bg-tab" data-bg="black" title="Black"><i class="fa-solid fa-moon"></i></button>
<button class="bg-tab" data-bg="checker" title="Checker"><i class="fa-solid fa-chess-board"></i></button>
</div>
<div class="hue-control"><label>Hue</label><input type="range" class="hue-slider" id="hue-slider" min="-180" max="180" value="0"><span class="hue-val" id="hue-val">0°</span></div>
<div class="color-pick-wrap"><label>Tint</label><input type="color" id="tint-color" value="#3b82f6"><button class="reset" onclick="resetTint()"><i class="fa-solid fa-xmark"></i></button></div>
</div>
<div class="canvas-wrap" id="canvas-wrap"><div id="preview-element"><div class="preview-empty"><i class="fa-solid fa-hand-pointer"></i><div>Pick a style from the left to start</div></div></div></div>
<div class="settings-panel">
<div class="settings-header">
<div class="settings-title"><h3>Style Settings</h3><span class="style-name" id="style-name-display">No style</span></div>
<div class="export-tabs" id="export-tabs">
<button class="export-tab active" data-tab="figma"><i class="fa-brands fa-figma"></i> Figma</button>
<button class="export-tab" data-tab="css"><i class="fa-brands fa-css3-alt"></i> CSS</button>
<button class="export-tab" data-tab="lua"><i class="fa-solid fa-cube"></i> Lua</button>
</div>
</div>
<div class="settings-body" id="settings-body"><p style="color:var(--muted);font-size:13px;text-align:center;padding:40px 0;"><i class="fa-solid fa-arrow-left" style="margin-right:8px;"></i>Select a material</p></div>
</div>
</main>
</div>
<div class="toast-stack" id="toast-stack"></div>
<script>
const M=(id,name,fill,stroke,effects,radius)=>({id,name,fill,stroke,effects,radius});
const F=(type,angle,...stops)=>({type,angle,stops:stops.map(s=>({h:s[0],s:s[1],l:s[2],pos:s[3]}))});
const S=(h,s,l,a,width)=>({h,s,l,a,width,position:'inside'});
const IS=(h,s,l,a,x,y,blur,spread=0)=>({type:'inner-shadow',h,s,l,a,x,y,blur,spread});
const DS=(h,s,l,a,x,y,blur,spread=0)=>({type:'drop-shadow',h,s,l,a,x,y,blur,spread});
const MATERIALS={
premium:[
M('silver','Silver',F('linear',180,[0,0,92,0],[0,0,72,50],[0,0,50,100]),S(0,0,30,100,1),[IS(0,0,100,60,0,1,0),IS(0,0,0,30,0,-1,0),DS(0,0,0,25,0,2,4)],8),

function hslToHex(h,s,l){h=((h%360)+360)%360;l/=100;const a=s*Math.min(l,1-l)/100;const f=n=>{const k=(n+h/30)%12;const c=l-a*Math.max(Math.min(k-3,9-k,1),-1);return Math.round(255*c).toString(16).padStart(2,'0');};return`#${f(0)}${f(8)}${f(4)}`;}
function hslToRgb(h,s,l){h=((h%360)+360)%360;l/=100;const a=s*Math.min(l,1-l)/100;const f=n=>{const k=(n+h/30)%12;const c=l-a*Math.max(Math.min(k-3,9-k,1),-1);return Math.round(255*c);};return{r:f(0),g:f(8),b:f(4)};}
function hexToHsl(hex){hex=hex.replace('#','');let r=parseInt(hex.substr(0,2),16)/255,g=parseInt(hex.substr(2,2),16)/255,b=parseInt(hex.substr(4,2),16)/255;let max=Math.max(r,g,b),min=Math.min(r,g,b);let h,s,l=(max+min)/2;if(max==min){h=s=0;}else{let d=max-min;s=l>0.5?d/(2-max-min):d/(max+min);switch(max){case r:h=(g-b)/d+(g<b?6:0);break;case g:h=(b-r)/d+2;break;case b:h=(r-g)/d+4;break;}h/=6;}return{h:Math.round(h*360),s:Math.round(s*100),l:Math.round(l*100)};}
function shiftedH(originalH){let h=originalH;if(tintEnabled&&tintHue!==null){const tintBase=215;h=((h-tintBase+tintHue)%360+360)%360;}return((h+hueShift)%360+360)%360;}
function hslaCss(h,s,l,a){return`hsla(${shiftedH(h)}, ${s}%, ${l}%, ${(a||100)/100})`;}
function renderCategories(){
document.getElementById('category-tabs').innerHTML=CATEGORIES.map(cat=>`<div class="cat-tab ${cat.id===currentCategory?'active':''} ${cat.special?'special':''}" onclick="selectCategory('${cat.id}')"><div class="cat-emoji">${cat.emoji}</div><div class="cat-name">${cat.name}</div></div>`).join('');
let total=0;Object.keys(MATERIALS).forEach(k=>total+=MATERIALS[k].length);
document.getElementById('total-count').textContent=total;
}
function selectCategory(catId){currentCategory=catId;renderCategories();renderMaterials();const cat=CATEGORIES.find(c=>c.id===catId);document.getElementById('materials-heading').textContent=cat.name+' Styles';}
function getMaterialsForCategory(catId){if(catId==='favorites'){const all=[];Object.keys(MATERIALS).forEach(k=>{MATERIALS[k].forEach(m=>{if(favorites.includes(`${k}:${m.id}`))all.push({...m,_cat:k});});});return all;}return(MATERIALS[catId]||[]).map(m=>({...m,_cat:catId}));}
function renderMaterials(){
let mats=getMaterialsForCategory(currentCategory);
if(searchQuery){const q=searchQuery.toLowerCase();mats=mats.filter(m=>m.name.toLowerCase().includes(q));}
document.getElementById('mat-count').textContent=mats.length;
const container=document.getElementById('material-grid');
if(!mats.length){container.innerHTML=`<div class="empty-state" style="grid-column:1/-1"><i class="fa-regular fa-folder-open"></i>${currentCategory==='favorites'?'No favorites yet':'No styles found'}</div>`;return;}
container.innerHTML=mats.map(mat=>{const previewCss=buildPreviewCss(mat);const favKey=`${mat._cat}:${mat.id}`;const isFav=favorites.includes(favKey);return`<div class="material-card ${mat.id===currentMaterialId?'selected':''}" onclick="selectMaterial('${mat.id}','${mat._cat}')"><button class="fav-btn ${isFav?'fav-on':''}" onclick="event.stopPropagation();toggleFav('${favKey}')"><i class="fa-${isFav?'solid':'regular'} fa-star"></i></button><div class="material-preview" style="${previewCss}"></div><div class="material-name">${mat.name}</div></div>`;}).join('');
}
function buildPreviewCss(mat){let bg='';if(mat.fill.type==='solid'){bg=hslaCss(mat.fill.stops[0].h,mat.fill.stops[0].s,mat.fill.stops[0].l,100);}else if(mat.fill.type==='linear'){const stops=mat.fill.stops.map(s=>`${hslaCss(s.h,s.s,s.l,100)} ${s.pos}%`).join(', ');bg=`linear-gradient(${mat.fill.angle}deg, ${stops})`;}else if(mat.fill.type==='radial'){const stops=mat.fill.stops.map(s=>`${hslaCss(s.h,s.s,s.l,100)} ${s.pos}%`).join(', ');bg=`radial-gradient(circle, ${stops})`;}return`background: ${bg};`;}
function selectMaterial(matId){currentMaterialId=matId;renderMaterials();applyMaterial();renderSettings();}
function toggleFav(key){const i=favorites.indexOf(key);if(i>-1){favorites.splice(i,1);toast('Removed','info');}else{favorites.push(key);toast('Added to favorites','success');}localStorage.setItem('polishui-favs',JSON.stringify(favorites));renderMaterials();}
function getCurrentMaterial(){if(!currentMaterialId)return null;for(const cat of Object.keys(MATERIALS)){const m=MATERIALS[cat].find(m=>m.id===currentMaterialId);if(m)return{...m,_cat:cat};}return null;}
function applyMaterial(){const mat=getCurrentMaterial();const el=document.getElementById('preview-element');if(!mat)return;el.innerHTML='';el.style.cssText='';const configs={button:{w:'160px',h:'52px',text:'Button',fs:'14px'},card:{w:'240px',h:'300px',text:'Card',fs:'16px'},frame:{w:'320px',h:'200px',text:'Frame',fs:'14px'},panel:{w:'380px',h:'240px',text:'Panel',fs:'15px'},badge:{w:'90px',h:'32px',text:'NEW',fs:'11px'},container:{w:'300px',h:'180px',text:'Container',fs:'14px'},icon:{w:'72px',h:'72px',text:'★',fs:'28px'}};const cfg=configs[currentElement];let bg='';if(mat.fill.type==='solid'){bg=hslaCss(mat.fill.stops[0].h,mat.fill.stops[0].s,mat.fill.stops[0].l,100);}else if(mat.fill.type==='linear'){const stops=mat.fill.stops.map(s=>`${hslaCss(s.h,s.s,s.l,100)} ${s.pos}%`).join(', ');bg=`linear-gradient(${mat.fill.angle}deg, ${stops})`;}else if(mat.fill.type==='radial'){const stops=mat.fill.stops.map(s=>`${hslaCss(s.h,s.s,s.l,100)} ${s.pos}%`).join(', ');bg=`radial-gradient(circle, ${stops})`;}el.style.background=bg;if(mat.stroke&&mat.stroke.width>0){el.style.border=`${mat.stroke.width}px solid ${hslaCss(mat.stroke.h,mat.stroke.s,mat.stroke.l,mat.stroke.a)}`;}const shadows=[];if(mat.effects){mat.effects.forEach(fx=>{const c=hslaCss(fx.h,fx.s,fx.l,fx.a);if(fx.type==='inner-shadow'){shadows.push(`inset ${fx.x}px ${fx.y}px ${fx.blur}px ${fx.spread||0}px ${c}`);}else{shadows.push(`${fx.x}px ${fx.y}px ${fx.blur}px ${fx.spread||0}px ${c}`);}});}el.style.boxShadow=shadows.length?shadows.join(', '):'none';el.style.borderRadius=(mat.radius||8)+'px';el.style.width=cfg.w;el.style.height=cfg.h;el.style.fontSize=cfg.fs;el.style.display='flex';el.style.alignItems='center';el.style.justifyContent='center';el.style.color='#fff';el.style.fontWeight='700';el.style.textShadow='0 1px 2px rgba(0,0,0,0.3)';el.textContent=cfg.text;document.getElementById('style-name-display').textContent=mat.name;}

document.querySelectorAll('.export-tab').forEach(btn=>{btn.addEventListener('click',()=>{document.querySelectorAll('.export-tab').forEach(b=>b.classList.remove('active'));btn.classList.add('active');currentExportTab=btn.dataset.tab;renderSettings();});});
function renderSettings(){const mat=getCurrentMaterial();const body=document.getElementById('settings-body');if(!mat){body.innerHTML=`<p style="color:var(--muted);font-size:13px;text-align:center;padding:40px 0;">Select a material</p>`;return;}if(currentExportTab==='figma')body.innerHTML=renderFigmaSettings(mat);else if(currentExportTab==='css')body.innerHTML=renderCssSettings(mat);else if(currentExportTab==='lua')body.innerHTML=renderLuaSettings(mat);}
function renderFigmaSettings(mat){let html='';html+=`<div class="settings-block"><div class="settings-block-header"><span class="block-icon icon-fill"><i class="fa-solid fa-fill-drip"></i></span>Fill</div><div class="settings-block-body">`;if(mat.fill.type==='solid'){const c=mat.fill.stops[0];html+=rowWithCopy('Type','Solid');html+=colorRow('Color',hslToHex(shiftedH(c.h),c.s,c.l));}else{const tn=mat.fill.type.charAt(0).toUpperCase()+mat.fill.type.slice(1)+' Gradient';html+=rowWithCopy('Type',tn);if(mat.fill.type==='linear')html+=rowWithCopy('Angle',mat.fill.angle+'°');mat.fill.stops.forEach((s,i)=>{html+=colorRow(`Stop ${i+1} (${s.pos}%)`,hslToHex(shiftedH(s.h),s.s,s.l));});}html+=`</div></div>`;if(mat.stroke&&mat.stroke.width>0){html+=`<div class="settings-block"><div class="settings-block-header"><span class="block-icon icon-stroke"><i class="fa-regular fa-square"></i></span>Stroke</div><div class="settings-block-body">${colorRow('Color',hslToHex(shiftedH(mat.stroke.h),mat.stroke.s,mat.stroke.l),mat.stroke.a)}${rowWithCopy('Weight',mat.stroke.width+'px')}${rowWithCopy('Position',mat.stroke.position||'Inside')}</div></div>`;}if(mat.effects&&mat.effects.length){mat.effects.forEach((fx,i)=>{const isInner=fx.type==='inner-shadow';html+=`<div class="settings-block"><div class="settings-block-header"><span class="block-icon icon-effect"><i class="fa-solid ${isInner?'fa-circle-half-stroke':'fa-clone'}"></i></span>${isInner?'Inner Shadow':'Drop Shadow'}${mat.effects.length>1?' #'+(i+1):''}</div><div class="settings-block-body">${colorRow('Color',hslToHex(shiftedH(fx.h),fx.s,fx.l),fx.a)}${rowWithCopy('X',fx.x+'px')}${rowWithCopy('Y',fx.y+'px')}${rowWithCopy('Blur',fx.blur+'px')}${rowWithCopy('Spread',(fx.spread||0)+'px')}</div></div>`;});}html+=`<div class="settings-block"><div class="settings-block-header"><span class="block-icon icon-corner"><i class="fa-solid fa-vector-square"></i></span>Corner Radius</div><div class="settings-block-body">${rowWithCopy('Radius',mat.radius+'px')}</div></div>`;html+=`<div class="code-actions"><button class="code-btn" onclick="copyAllFigma()"><i class="fa-solid fa-copy"></i> Copy All Settings</button></div>`;return html;}
function rowWithCopy(k,v){return`<div class="settings-row"><span class="key">${k}</span><span class="value">${v}<button class="copy-btn" onclick="copyText('${escapeAttr(v)}',this)"><i class="fa-regular fa-copy"></i></button></span></div>`;}
function colorRow(k,hex,a){const d=a!==undefined&&a<100?`${hex} · ${a}%`:hex;return`<div class="settings-row"><span class="key">${k}</span><span class="value"><span class="color-chip" style="background:${hex}"></span>${d}<button class="copy-btn" onclick="copyText('${hex}',this)"><i class="fa-regular fa-copy"></i></button></span></div>`;}
function escapeAttr(s){return String(s).replace(/'/g,"\\'").replace(/"/g,'&quot;');}
function renderCssSettings(mat){const css=buildCssCode(mat);return`<div class="code-block">${highlightCss(css)}</div><div class="code-actions"><button class="code-btn" onclick="copyText(${JSON.stringify(css)},this)"><i class="fa-solid fa-copy"></i> Copy CSS</button></div>`;}
function buildCssCode(mat){let bg='';if(mat.fill.type==='solid'){bg=hslToHex(shiftedH(mat.fill.stops[0].h),mat.fill.stops[0].s,mat.fill.stops[0].l);}else if(mat.fill.type==='linear'){const stops=mat.fill.stops.map(s=>`${hslToHex(shiftedH(s.h),s.s,s.l)} ${s.pos}%`).join(', ');bg=`linear-gradient(${mat.fill.angle}deg, ${stops})`;}else if(mat.fill.type==='radial'){const stops=mat.fill.stops.map(s=>`${hslToHex(shiftedH(s.h),s.s,s.l)} ${s.pos}%`).join(', ');bg=`radial-gradient(circle, ${stops})`;}let css=`.${mat.id} {\n  background: ${bg};\n`;if(mat.stroke&&mat.stroke.width>0){const rgba=hslaCssExport(mat.stroke.h,mat.stroke.s,mat.stroke.l,mat.stroke.a);css+=`  border: ${mat.stroke.width}px solid ${rgba};\n`;}if(mat.effects&&mat.effects.length){const shadows=mat.effects.map(fx=>{const c=hslaCssExport(fx.h,fx.s,fx.l,fx.a);if(fx.type==='inner-shadow')return`inset ${fx.x}px ${fx.y}px ${fx.blur}px ${fx.spread||0}px ${c}`;return`${fx.x}px ${fx.y}px ${fx.blur}px ${fx.spread||0}px ${c}`;});css+=`  box-shadow:\n    ${shadows.join(',\n    ')};\n`;}css+=`  border-radius: ${mat.radius}px;\n}`;return css;}
function hslaCssExport(h,s,l,a){const{r,g,b}=hslToRgb(shiftedH(h),s,l);return`rgba(${r}, ${g}, ${b}, ${(a||100)/100})`;}
function highlightCss(css){return css.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/([a-z-]+)(\s*):/g,'<span class="k">$1</span>$2:').replace(/(#[0-9a-fA-F]{3,8})/g,'<span class="n">$1</span>').replace(/(rgba?\([^)]+\))/g,'<span class="n">$1</span>').replace(/(\d+(?:\.\d+)?(?:px|%|deg|em|rem)?)/g,'<span class="n">$1</span>');}
function renderLuaSettings(mat){const lua=buildLuaCode(mat);return`<div class="code-block">${highlightLua(lua)}</div><div class="code-actions"><button class="code-btn" onclick="copyText(${JSON.stringify(lua)},this)"><i class="fa-solid fa-copy"></i> Copy Lua</button></div>`;}
function buildLuaCode(mat){let lua=`-- PolishUI: ${mat.name}\nlocal frame = Instance.new("Frame")\nframe.Name = "${mat.name}"\nframe.Size = UDim2.new(0, 200, 0, 60)\nframe.AnchorPoint = Vector2.new(0.5, 0.5)\nframe.Position = UDim2.new(0.5, 0, 0.5, 0)\n`;const main=mat.fill.stops[Math.floor(mat.fill.stops.length/2)];const rgb=hslToRgb(shiftedH(main.h),main.s,main.l);lua+=`frame.BackgroundColor3 = Color3.fromRGB(${rgb.r}, ${rgb.g}, ${rgb.b})\nframe.BorderSizePixel = 0\n\nlocal corner = Instance.new("UICorner")\ncorner.CornerRadius = UDim.new(0, ${mat.radius})\ncorner.Parent = frame\n\n`;if(mat.fill.type!=='solid'&&mat.fill.stops.length>=2){lua+=`local gradient = Instance.new("UIGradient")\n`;const seq=mat.fill.stops.map(s=>{const c=hslToRgb(shiftedH(s.h),s.s,s.l);const t=(s.pos/100).toFixed(2);return`ColorSequenceKeypoint.new(${t}, Color3.fromRGB(${c.r}, ${c.g}, ${c.b}))`;}).join(',\n  ');lua+=`gradient.Color = ColorSequence.new({\n  ${seq}\n})\n`;let rot=0;if(mat.fill.type==='linear')rot=mat.fill.angle-90;lua+=`gradient.Rotation = ${rot}\ngradient.Parent = frame\n\n`;}if(mat.stroke&&mat.stroke.width>0){const sc=hslToRgb(shiftedH(mat.stroke.h),mat.stroke.s,mat.stroke.l);lua+=`local stroke = Instance.new("UIStroke")\nstroke.Color = Color3.fromRGB(${sc.r}, ${sc.g}, ${sc.b})\nstroke.Thickness = ${mat.stroke.width}\nstroke.Transparency = ${(1-(mat.stroke.a||100)/100).toFixed(2)}\nstroke.ApplyStrokeMode = Enum.ApplyStrokeMode.Border\nstroke.Parent = frame\n\n`;}lua+=`frame.Parent = script.Parent`;return lua;}
function highlightLua(code){return code.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/(--[^\n]*)/g,'<span class="c">$1</span>').replace(/\b(local|function|end|if|then|else|return|for|do|while)\b/g,'<span class="p">$1</span>').replace(/\b(Instance|Color3|UDim2|UDim|Vector2|Enum|ColorSequence|ColorSequenceKeypoint)\b/g,'<span class="k">$1</span>').replace(/("[^"]*")/g,'<span class="s">$1</span>').replace(/\b(\d+(?:\.\d+)?)\b/g,'<span class="n">$1</span>');}
function copyText(text,btn){navigator.clipboard.writeText(text).then(()=>{if(btn){btn.classList.add('copied');const ic=btn.innerHTML;btn.innerHTML='<i class="fa-solid fa-check"></i>';setTimeout(()=>{btn.classList.remove('copied');btn.innerHTML=ic;},1500);}toast('Copied!','success');});}
function copyAllFigma(){const mat=getCurrentMaterial();if(!mat)return;let t=`═══ POLISHUI: ${mat.name.toUpperCase()} ═══\n\n▸ FILL\n`;if(mat.fill.type==='solid'){t+=`  Type: Solid\n  Color: ${hslToHex(shiftedH(mat.fill.stops[0].h),mat.fill.stops[0].s,mat.fill.stops[0].l)}\n`;}else{t+=`  Type: ${mat.fill.type.charAt(0).toUpperCase()+mat.fill.type.slice(1)} Gradient\n`;if(mat.fill.type!=='radial')t+=`  Angle: ${mat.fill.angle}°\n`;mat.fill.stops.forEach((s,i)=>{t+=`  Stop ${i+1}: ${hslToHex(shiftedH(s.h),s.s,s.l)} at ${s.pos}%\n`;});}if(mat.stroke&&mat.stroke.width>0){t+=`\n▸ STROKE\n  Color: ${hslToHex(shiftedH(mat.stroke.h),mat.stroke.s,mat.stroke.l)} (${mat.stroke.a}%)\n  Weight: ${mat.stroke.width}px\n  Position: ${mat.stroke.position||'Inside'}\n`;}if(mat.effects&&mat.effects.length){mat.effects.forEach((fx,i)=>{const isI=fx.type==='inner-shadow';t+=`\n▸ ${isI?'INNER SHADOW':'DROP SHADOW'}${mat.effects.length>1?' #'+(i+1):''}\n  Color: ${hslToHex(shiftedH(fx.h),fx.s,fx.l)} (${fx.a}%)\n  X: ${fx.x}px   Y: ${fx.y}px\n  Blur: ${fx.blur}px   Spread: ${fx.spread||0}px\n`;});}t+=`\n▸ CORNER RADIUS: ${mat.radius}px\n`;navigator.clipboard.writeText(t).then(()=>{toast('All settings copied!','success');});}
function toggleTheme(){const html=document.documentElement;const cur=html.getAttribute('data-theme');const nx=cur==='light'?'dark':'light';html.setAttribute('data-theme',nx);localStorage.setItem('polishui-theme',nx);document.getElementById('themeIcon').className=nx==='light'?'fa-regular fa-moon':'fa-regular fa-sun';}
(function(){const s=localStorage.getItem('polishui-theme');if(s){document.documentElement.setAttribute('data-theme',s);document.getElementById('themeIcon').className=s==='light'?'fa-regular fa-moon':'fa-regular fa-sun';}})();
function toast(msg,type){const stack=document.getElementById('toast-stack');const t=document.createElement('div');t.className='toast';t.innerHTML=`<i class="fa-solid ${type==='success'?'fa-circle-check':'fa-info-circle'}" style="color:${type==='success'?'var(--success)':'var(--accent)'}"></i><span>${msg}</span>`;stack.appendChild(t);setTimeout(()=>t.remove(),2500);}
renderCategories();renderMaterials();
</script>
</body>
</html>

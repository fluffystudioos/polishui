<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PolishUI — UI Style Reference for Designers</title>
<meta name="description" content="Pre-made UI styles (Metal, Glass, Neon, Sakura...) with Figma, CSS and Roblox Lua exports. For Figma, Photoshop and Roblox UI designers.">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<style>
:root[data-theme="light"] {
  --bg: #fafafa;
  --bg-2: #ffffff;
  --bg-3: #f3f4f6;
  --bg-hover: #f9fafb;
  --text: #111827;
  --text-2: #374151;
  --text-muted: #6b7280;
  --text-dim: #9ca3af;
  --border: #e5e7eb;
  --border-strong: #d1d5db;
  --accent: #3b82f6;
  --accent-2: #2563eb;
  --accent-glow: rgba(59, 130, 246, 0.15);
  --success: #10b981;
  --danger: #ef4444;
  --shadow-sm: 0 1px 2px rgba(0,0,0,0.05);
  --shadow: 0 4px 12px rgba(0,0,0,0.08);
  --shadow-lg: 0 12px 30px rgba(0,0,0,0.12);
  --canvas-bg: #f3f4f6;
  --canvas-grid: rgba(0,0,0,0.04);
}
:root[data-theme="dark"] {
  --bg: #0a0a0b;
  --bg-2: #111114;
  --bg-3: #18181b;
  --bg-hover: #1c1c20;
  --text: #f4f4f5;
  --text-2: #d4d4d8;
  --text-muted: #a1a1aa;
  --text-dim: #71717a;
  --border: rgba(255,255,255,0.08);
  --border-strong: rgba(255,255,255,0.16);
  --accent: #60a5fa;
  --accent-2: #3b82f6;
  --accent-glow: rgba(96, 165, 250, 0.2);
  --success: #34d399;
  --danger: #f87171;
  --shadow-sm: 0 1px 2px rgba(0,0,0,0.4);
  --shadow: 0 4px 12px rgba(0,0,0,0.4);
  --shadow-lg: 0 12px 30px rgba(0,0,0,0.5);
  --canvas-bg: #0a0a0b;
  --canvas-grid: rgba(255,255,255,0.04);
}

* { margin: 0; padding: 0; box-sizing: border-box; }
html { background: var(--bg); }
body {
  font-family: 'Inter', sans-serif;
  background: var(--bg); color: var(--text);
  -webkit-font-smoothing: antialiased;
  height: 100vh; overflow: hidden;
  transition: background 0.3s, color 0.3s;
}

/* ═══ TOPBAR ═══ */
.topbar {
  height: 56px; background: var(--bg-2);
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center;
  padding: 0 20px; gap: 16px;
  z-index: 100;
}
.brand {
  display: flex; align-items: center; gap: 10px;
  font-family: 'Space Grotesk', sans-serif;
  font-weight: 700; font-size: 16px;
  color: var(--text); text-decoration: none;
  letter-spacing: -0.3px;
}
.brand-logo {
  width: 28px; height: 28px; border-radius: 8px;
  background: linear-gradient(135deg, var(--accent), #8b5cf6);
  display: flex; align-items: center; justify-content: center;
  color: #fff; font-size: 13px;
  box-shadow: 0 4px 12px var(--accent-glow);
}
.brand .pro { color: var(--accent); }

.topbar-info {
  font-size: 12px; color: var(--text-muted); font-weight: 500;
  display: flex; align-items: center; gap: 6px;
}
.topbar-divider { width: 1px; height: 24px; background: var(--border); }
.topbar-actions { margin-left: auto; display: flex; align-items: center; gap: 8px; }

.icon-btn {
  width: 36px; height: 36px; border-radius: 8px;
  border: 1px solid var(--border); background: var(--bg-2);
  color: var(--text-muted); cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; transition: all 0.15s;
}
.icon-btn:hover { background: var(--bg-hover); color: var(--text); border-color: var(--border-strong); }

.btn-ghost {
  padding: 8px 14px; border-radius: 8px;
  background: transparent; color: var(--text-2);
  border: 1px solid var(--border);
  font-family: 'Inter', sans-serif; font-size: 13px; font-weight: 500;
  cursor: pointer; display: inline-flex; align-items: center; gap: 6px;
  transition: all 0.15s;
}
.btn-ghost:hover { background: var(--bg-hover); border-color: var(--border-strong); }

/* ═══ WORKSPACE ═══ */
.workspace {
  display: grid;
  grid-template-columns: 280px 1fr;
  height: calc(100vh - 56px);
}

/* ═══ SIDEBAR ═══ */
.sidebar {
  background: var(--bg-2);
  border-right: 1px solid var(--border);
  overflow-y: auto;
  scrollbar-width: thin;
  scrollbar-color: var(--border-strong) transparent;
}
.sidebar::-webkit-scrollbar { width: 6px; }
.sidebar::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 3px; }

.sidebar-header {
  padding: 14px 18px 8px;
}
.sidebar-header h3 {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 10px; font-weight: 700;
  text-transform: uppercase; letter-spacing: 1.5px;
  color: var(--text-muted);
}

/* CATEGORY TABS */
.category-tabs {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 6px;
  padding: 4px 14px 14px;
}
.cat-tab {
  display: flex; flex-direction: column; align-items: center;
  gap: 4px; padding: 10px 6px;
  border: 1px solid var(--border);
  background: var(--bg-2); border-radius: 10px;
  cursor: pointer; transition: all 0.15s;
  color: var(--text-2);
}
.cat-tab:hover { background: var(--bg-hover); border-color: var(--border-strong); }
.cat-tab.active {
  background: var(--accent); color: #fff; border-color: var(--accent);
  box-shadow: 0 4px 12px var(--accent-glow);
}
.cat-tab .cat-emoji { font-size: 18px; }
.cat-tab .cat-name {
  font-size: 11px; font-weight: 600;
  font-family: 'Space Grotesk', sans-serif;
}

/* MATERIAL GRID */
.materials-section {
  padding: 4px 14px 20px;
}
.materials-section h4 {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 10px; font-weight: 700;
  text-transform: uppercase; letter-spacing: 1.5px;
  color: var(--text-muted); margin-bottom: 10px;
  padding-left: 4px;
}

.material-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 8px;
}
.material-card {
  cursor: pointer;
  border-radius: 10px;
  overflow: hidden;
  border: 1px solid var(--border);
  background: var(--bg-2);
  transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
  position: relative;
}
.material-card:hover {
  transform: translateY(-2px);
  border-color: var(--border-strong);
  box-shadow: var(--shadow);
}
.material-card.selected {
  border-color: var(--accent);
  box-shadow: 0 0 0 2px var(--accent-glow), var(--shadow);
}
.material-preview {
  height: 60px;
  width: 100%;
  /* style burada inline ile uygulanacak */
}
.material-name {
  padding: 6px 8px;
  font-size: 11px; font-weight: 600;
  color: var(--text-2);
  text-align: center;
  font-family: 'Space Grotesk', sans-serif;
  background: var(--bg-2);
  border-top: 1px solid var(--border);
}
.material-card.selected .material-name {
  color: var(--accent);
}

/* ═══ MAIN AREA ═══ */
.main {
  display: grid;
  grid-template-rows: auto 1fr auto;
  overflow: hidden;
}

/* CANVAS */
.canvas-wrap {
  background: var(--canvas-bg);
  background-image:
    linear-gradient(var(--canvas-grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--canvas-grid) 1px, transparent 1px);
  background-size: 24px 24px;
  display: flex; align-items: center; justify-content: center;
  padding: 30px; overflow: auto;
  position: relative;
}
#preview-element {
  display: flex; align-items: center; justify-content: center;
  font-family: 'Inter', sans-serif; font-weight: 700;
  color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,0.2);
  transition: all 0.3s ease;
  position: relative;
}

.preview-empty {
  color: var(--text-dim);
  font-size: 14px;
  text-align: center;
  padding: 60px;
}
.preview-empty i {
  font-size: 40px;
  display: block;
  margin-bottom: 12px;
  opacity: 0.4;
}

/* CONTROLS BAR (above canvas) */
.controls-bar {
  padding: 12px 20px;
  background: var(--bg-2);
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 12px;
  flex-wrap: wrap;
}

.element-tabs {
  display: flex; gap: 3px; background: var(--bg-3);
  padding: 3px; border-radius: 8px;
  border: 1px solid var(--border);
}
.elem-tab {
  padding: 6px 10px; border-radius: 5px;
  border: none; background: transparent;
  color: var(--text-muted);
  font-family: 'Inter', sans-serif; font-size: 11px; font-weight: 500;
  cursor: pointer; transition: all 0.15s;
  display: flex; align-items: center; gap: 5px;
}
.elem-tab:hover { color: var(--text); }
.elem-tab.active { background: var(--bg-2); color: var(--text); box-shadow: var(--shadow-sm); }

.hue-control {
  display: flex; align-items: center; gap: 10px;
  flex: 1; min-width: 200px;
  max-width: 360px;
}
.hue-control label {
  font-size: 11px; color: var(--text-muted); font-weight: 600;
  text-transform: uppercase; letter-spacing: 0.5px;
}
.hue-slider {
  flex: 1; -webkit-appearance: none; appearance: none;
  height: 8px; border-radius: 4px; outline: none; cursor: pointer;
  background: linear-gradient(to right, 
    hsl(0,80%,60%), hsl(60,80%,60%), hsl(120,80%,60%), 
    hsl(180,80%,60%), hsl(240,80%,60%), hsl(300,80%,60%), hsl(360,80%,60%)
  );
}
.hue-slider::-webkit-slider-thumb {
  -webkit-appearance: none; appearance: none;
  width: 18px; height: 18px; border-radius: 50%;
  background: #fff; cursor: pointer;
  border: 2px solid var(--bg-2);
  box-shadow: 0 2px 6px rgba(0,0,0,0.25);
}
.hue-slider::-moz-range-thumb {
  width: 18px; height: 18px; border-radius: 50%;
  background: #fff; cursor: pointer;
  border: 2px solid var(--bg-2);
  box-shadow: 0 2px 6px rgba(0,0,0,0.25);
}
.hue-val {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px; color: var(--text-2);
  min-width: 36px; text-align: right; font-weight: 600;
}

.reset-hue {
  background: none; border: 1px solid var(--border);
  border-radius: 6px; padding: 6px 8px;
  color: var(--text-muted); cursor: pointer;
  font-size: 10px; transition: all 0.15s;
}
.reset-hue:hover { background: var(--bg-hover); color: var(--text); }

/* ═══ SETTINGS PANEL (bottom) ═══ */
.settings-panel {
  background: var(--bg-2);
  border-top: 1px solid var(--border);
  max-height: 40vh;
  overflow-y: auto;
  scrollbar-width: thin;
  scrollbar-color: var(--border-strong) transparent;
}
.settings-panel::-webkit-scrollbar { width: 6px; }
.settings-panel::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 3px; }

.settings-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 20px 10px;
  position: sticky; top: 0;
  background: var(--bg-2);
  border-bottom: 1px solid var(--border);
  z-index: 10;
}
.settings-title {
  display: flex; align-items: center; gap: 10px;
}
.settings-title h3 {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 14px; font-weight: 700;
  color: var(--text);
}
.settings-title .style-name {
  font-size: 12px; color: var(--text-muted);
  font-weight: 500;
  padding: 3px 10px; border-radius: 999px;
  background: var(--bg-3); border: 1px solid var(--border);
}

.export-tabs {
  display: flex; gap: 4px; background: var(--bg-3);
  padding: 3px; border-radius: 7px; border: 1px solid var(--border);
}
.export-tab {
  padding: 6px 12px; border-radius: 5px;
  border: none; background: transparent;
  color: var(--text-muted);
  font-family: 'Inter', sans-serif; font-size: 11px; font-weight: 600;
  cursor: pointer; transition: all 0.15s;
  display: flex; align-items: center; gap: 5px;
}
.export-tab:hover { color: var(--text); }
.export-tab.active { background: var(--bg-2); color: var(--text); box-shadow: var(--shadow-sm); }

.settings-body { padding: 16px 20px 20px; }

/* SETTINGS DISPLAY (Figma view) */
.settings-block {
  margin-bottom: 18px;
  background: var(--bg-3);
  border: 1px solid var(--border);
  border-radius: 10px;
  overflow: hidden;
}
.settings-block-header {
  display: flex; align-items: center; gap: 8px;
  padding: 10px 14px;
  background: var(--bg-2);
  border-bottom: 1px solid var(--border);
  font-family: 'Space Grotesk', sans-serif;
  font-size: 11px; font-weight: 700;
  text-transform: uppercase; letter-spacing: 1px;
  color: var(--text-2);
}
.settings-block-header .block-icon {
  width: 20px; height: 20px; border-radius: 5px;
  display: flex; align-items: center; justify-content: center;
  color: #fff; font-size: 9px;
}
.settings-block-body {
  padding: 12px 14px;
  display: flex; flex-direction: column; gap: 8px;
}
.settings-row {
  display: flex; align-items: center; justify-content: space-between;
  gap: 12px;
  padding: 6px 0;
}
.settings-row + .settings-row {
  border-top: 1px solid var(--border);
}
.settings-row .key {
  font-size: 11px; color: var(--text-muted);
  font-weight: 500; min-width: 90px;
}
.settings-row .value {
  display: flex; align-items: center; gap: 8px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px; color: var(--text); font-weight: 500;
  flex: 1; justify-content: flex-end;
}
.color-chip {
  width: 18px; height: 18px; border-radius: 4px;
  border: 1px solid var(--border-strong);
  flex-shrink: 0;
}
.copy-btn {
  width: 24px; height: 24px; border-radius: 5px;
  border: 1px solid var(--border);
  background: var(--bg-2); color: var(--text-muted);
  cursor: pointer; font-size: 10px;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.15s;
}
.copy-btn:hover { background: var(--accent); color: #fff; border-color: var(--accent); }
.copy-btn.copied { background: var(--success); color: #fff; border-color: var(--success); }

/* CODE BLOCKS */
.code-block {
  background: var(--bg-3);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 14px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  color: var(--text-2);
  white-space: pre-wrap;
  overflow-x: auto;
  line-height: 1.6;
  max-height: 300px;
  overflow-y: auto;
}
.code-actions {
  display: flex; gap: 8px; margin-top: 10px;
}
.code-btn {
  padding: 8px 14px; border-radius: 7px;
  background: var(--accent); color: #fff; border: none;
  font-family: 'Inter', sans-serif; font-size: 12px; font-weight: 600;
  cursor: pointer; display: inline-flex; align-items: center; gap: 6px;
  transition: all 0.15s;
}
.code-btn:hover { background: var(--accent-2); transform: translateY(-1px); }
.code-btn.success { background: var(--success); }

/* Block icons */
.icon-fill { background: linear-gradient(135deg, #3b82f6, #8b5cf6); }
.icon-stroke { background: linear-gradient(135deg, #10b981, #06b6d4); }
.icon-effect { background: linear-gradient(135deg, #1f2937, #000); }
.icon-corner { background: linear-gradient(135deg, #ec4899, #a855f7); }

/* TOAST */
.toast-stack {
  position: fixed; bottom: 24px; right: 24px;
  display: flex; flex-direction: column-reverse; gap: 8px;
  z-index: 9999; pointer-events: none;
}
.toast {
  background: var(--bg-2); border: 1px solid var(--border);
  box-shadow: var(--shadow-lg); border-radius: 10px;
  padding: 12px 16px; display: flex; align-items: center; gap: 10px;
  font-size: 13px; font-weight: 500;
  animation: slideIn 0.3s ease, fadeOut 0.3s 2s ease forwards;
  pointer-events: all;
}
@keyframes slideIn {
  from { transform: translateX(20px); opacity: 0; }
  to { transform: translateX(0); opacity: 1; }
}
@keyframes fadeOut {
  to { opacity: 0; transform: translateX(20px); }
}

/* MOBILE */
@media(max-width: 900px) {
  body { overflow: auto; height: auto; }
  .workspace { grid-template-columns: 1fr; height: auto; }
  .sidebar { border-right: none; border-bottom: 1px solid var(--border); max-height: none; }
  .category-tabs { grid-template-columns: repeat(4, 1fr); }
  .material-grid { grid-template-columns: repeat(3, 1fr); }
  .controls-bar { flex-direction: column; align-items: stretch; }
  .hue-control { width: 100%; max-width: none; }
  .canvas-wrap { min-height: 280px; padding: 20px; }
  .settings-panel { max-height: none; }
}

@media(max-width: 500px) {
  .material-grid { grid-template-columns: repeat(2, 1fr); }
  .element-tabs { overflow-x: auto; }
  .elem-tab { white-space: nowrap; }
}
</style>
</head>
<body>

<!-- TOPBAR -->
<header class="topbar">
  <a href="#" class="brand">
    <div class="brand-logo"><i class="fa-solid fa-wand-magic-sparkles"></i></div>
    <span>Polish<span class="pro">UI</span></span>
  </a>
  <div class="topbar-divider"></div>
  <span class="topbar-info">
    <i class="fa-solid fa-bookmark"></i>
    UI Style Reference
  </span>

  <div class="topbar-actions">
    <button class="btn-ghost" onclick="showHelp()">
      <i class="fa-regular fa-circle-question"></i> Help
    </button>
    <button class="icon-btn" onclick="toggleTheme()" title="Toggle theme">
      <i class="fa-regular fa-moon" id="themeIcon"></i>
    </button>
  </div>
</header>

<!-- WORKSPACE -->
<div class="workspace">

  <!-- SIDEBAR: Categories + Materials -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <h3>Categories</h3>
    </div>
    
    <div class="category-tabs" id="category-tabs">
      <!-- Kategoriler JS ile dolacak -->
    </div>
    
    <div class="materials-section">
      <h4 id="materials-heading">Styles</h4>
      <div class="material-grid" id="material-grid">
        <!-- Materialler JS ile dolacak -->
      </div>
    </div>
  </aside>

  <!-- MAIN -->
  <main class="main">
    
    <!-- Controls -->
    <div class="controls-bar">
      <div class="element-tabs" id="element-tabs">
        <button class="elem-tab active" data-element="button"><i class="fa-solid fa-square"></i> Button</button>
        <button class="elem-tab" data-element="card"><i class="fa-solid fa-id-card"></i> Card</button>
        <button class="elem-tab" data-element="frame"><i class="fa-regular fa-square"></i> Frame</button>
        <button class="elem-tab" data-element="panel"><i class="fa-solid fa-window-maximize"></i> Panel</button>
        <button class="elem-tab" data-element="badge"><i class="fa-solid fa-certificate"></i> Badge</button>
        <button class="elem-tab" data-element="container"><i class="fa-solid fa-box"></i> Container</button>
        <button class="elem-tab" data-element="icon"><i class="fa-solid fa-circle"></i> Icon BG</button>
      </div>
      
      <div class="hue-control">
        <label>Hue</label>
        <input type="range" class="hue-slider" id="hue-slider" min="-180" max="180" value="0">
        <span class="hue-val" id="hue-val">0°</span>
        <button class="reset-hue" onclick="resetHue()" title="Reset hue">
          <i class="fa-solid fa-rotate-left"></i>
        </button>
      </div>
    </div>

    <!-- Canvas -->
    <div class="canvas-wrap">
      <div id="preview-element">
        <div class="preview-empty">
          <i class="fa-solid fa-hand-pointer"></i>
          <div>Pick a style from the left to start</div>
        </div>
      </div>
    </div>

    <!-- Settings & Export -->
    <div class="settings-panel">
      <div class="settings-header">
        <div class="settings-title">
          <h3>Style Settings</h3>
          <span class="style-name" id="style-name-display">No style selected</span>
        </div>
        <div class="export-tabs" id="export-tabs">
          <button class="export-tab active" data-tab="figma"><i class="fa-brands fa-figma"></i> Figma</button>
          <button class="export-tab" data-tab="css"><i class="fa-brands fa-css3-alt"></i> CSS</button>
          <button class="export-tab" data-tab="lua"><i class="fa-solid fa-cube"></i> Roblox Lua</button>
        </div>
      </div>
      <div class="settings-body" id="settings-body">
        <p style="color: var(--text-muted); font-size: 13px; text-align: center; padding: 40px 0;">
          <i class="fa-solid fa-arrow-left" style="margin-right: 8px;"></i>
          Select a material from the sidebar to view its settings
        </p>
      </div>
    </div>

  </main>
</div>

<!-- TOAST CONTAINER -->
<div class="toast-stack" id="toast-stack"></div>

<script>
/* THEME TOGGLE */
function toggleTheme() {
  const html = document.documentElement;
  const current = html.getAttribute('data-theme');
  const next = current === 'light' ? 'dark' : 'light';
  html.setAttribute('data-theme', next);
  localStorage.setItem('polishui-theme', next);
  document.getElementById('themeIcon').className = next === 'light' ? 'fa-regular fa-moon' : 'fa-regular fa-sun';
}
(function() {
  const saved = localStorage.getItem('polishui-theme');
  if (saved) {
    document.documentElement.setAttribute('data-theme', saved);
    document.getElementById('themeIcon').className = saved === 'light' ? 'fa-regular fa-moon' : 'fa-regular fa-sun';
  }
})();

/* TOAST */
function toast(msg, type) {
  const stack = document.getElementById('toast-stack');
  const t = document.createElement('div');
  t.className = 'toast';
  t.innerHTML = `
    <i class="fa-solid ${type === 'success' ? 'fa-circle-check' : 'fa-info-circle'}" 
       style="color: ${type === 'success' ? 'var(--success)' : 'var(--accent)'}"></i>
    <span>${msg}</span>
  `;
  stack.appendChild(t);
  setTimeout(() => t.remove(), 2500);
}

function showHelp() {
  toast('Pick category → choose style → copy settings to Figma/CSS/Lua', 'info');
}

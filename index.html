<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PolishUI — UI Style Reference for Designers</title>
<meta name="description" content="Pre-made UI styles (Metal, Glass, Neon, Sakura...) with Figma, CSS and Roblox Lua exports.">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<style>
:root[data-theme="light"] {
  --bg: #fafafa; --bg-2: #ffffff; --bg-3: #f3f4f6; --bg-hover: #f9fafb;
  --text: #111827; --text-2: #374151; --text-muted: #6b7280; --text-dim: #9ca3af;
  --border: #e5e7eb; --border-strong: #d1d5db;
  --accent: #3b82f6; --accent-2: #2563eb; --accent-glow: rgba(59,130,246,0.15);
  --success: #10b981; --danger: #ef4444;
  --shadow-sm: 0 1px 2px rgba(0,0,0,0.05);
  --shadow: 0 4px 12px rgba(0,0,0,0.08);
  --shadow-lg: 0 12px 30px rgba(0,0,0,0.12);
  --canvas-bg: #f3f4f6; --canvas-grid: rgba(0,0,0,0.04);
}
:root[data-theme="dark"] {
  --bg: #0a0a0b; --bg-2: #111114; --bg-3: #18181b; --bg-hover: #1c1c20;
  --text: #f4f4f5; --text-2: #d4d4d8; --text-muted: #a1a1aa; --text-dim: #71717a;
  --border: rgba(255,255,255,0.08); --border-strong: rgba(255,255,255,0.16);
  --accent: #60a5fa; --accent-2: #3b82f6; --accent-glow: rgba(96,165,250,0.2);
  --success: #34d399; --danger: #f87171;
  --shadow-sm: 0 1px 2px rgba(0,0,0,0.4);
  --shadow: 0 4px 12px rgba(0,0,0,0.4);
  --shadow-lg: 0 12px 30px rgba(0,0,0,0.5);
  --canvas-bg: #0a0a0b; --canvas-grid: rgba(255,255,255,0.04);
}

* { margin: 0; padding: 0; box-sizing: border-box; }
html { background: var(--bg); }
body {
  font-family: 'Inter', sans-serif;
  background: var(--bg); color: var(--text);
  -webkit-font-smoothing: antialiased;
  height: 100vh; overflow: hidden;
  transition: background 0.3s, color 0.3s;
}

.topbar {
  height: 56px; background: var(--bg-2);
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; padding: 0 20px; gap: 16px; z-index: 100;
}
.brand {
  display: flex; align-items: center; gap: 10px;
  font-family: 'Space Grotesk', sans-serif;
  font-weight: 700; font-size: 16px;
  color: var(--text); text-decoration: none; letter-spacing: -0.3px;
}
.brand-logo {
  width: 28px; height: 28px; border-radius: 8px;
  background: linear-gradient(135deg, var(--accent), #8b5cf6);
  display: flex; align-items: center; justify-content: center;
  color: #fff; font-size: 13px;
  box-shadow: 0 4px 12px var(--accent-glow);
}
.brand .pro { color: var(--accent); }
.topbar-info { font-size: 12px; color: var(--text-muted); font-weight: 500; display: flex; align-items: center; gap: 6px; }
.topbar-divider { width: 1px; height: 24px; background: var(--border); }
.topbar-actions { margin-left: auto; display: flex; align-items: center; gap: 8px; }

.icon-btn {
  width: 36px; height: 36px; border-radius: 8px;
  border: 1px solid var(--border); background: var(--bg-2);
  color: var(--text-muted); cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; transition: all 0.15s;
}
.icon-btn:hover { background: var(--bg-hover); color: var(--text); border-color: var(--border-strong); }

.btn-ghost {
  padding: 8px 14px; border-radius: 8px;
  background: transparent; color: var(--text-2);
  border: 1px solid var(--border);
  font-family: 'Inter', sans-serif; font-size: 13px; font-weight: 500;
  cursor: pointer; display: inline-flex; align-items: center; gap: 6px;
  transition: all 0.15s;
}
.btn-ghost:hover { background: var(--bg-hover); border-color: var(--border-strong); }

.workspace { display: grid; grid-template-columns: 280px 1fr; height: calc(100vh - 56px); }

.sidebar {
  background: var(--bg-2); border-right: 1px solid var(--border);
  overflow-y: auto;
  scrollbar-width: thin; scrollbar-color: var(--border-strong) transparent;
}
.sidebar::-webkit-scrollbar { width: 6px; }
.sidebar::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 3px; }

.sidebar-header { padding: 14px 18px 8px; }
.sidebar-header h3 {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 10px; font-weight: 700;
  text-transform: uppercase; letter-spacing: 1.5px;
  color: var(--text-muted);
}

.category-tabs {
  display: grid; grid-template-columns: repeat(2, 1fr);
  gap: 6px; padding: 4px 14px 14px;
}
.cat-tab {
  display: flex; flex-direction: column; align-items: center;
  gap: 4px; padding: 10px 6px;
  border: 1px solid var(--border);
  background: var(--bg-2); border-radius: 10px;
  cursor: pointer; transition: all 0.15s;
  color: var(--text-2);
}
.cat-tab:hover { background: var(--bg-hover); border-color: var(--border-strong); }
.cat-tab.active {
  background: var(--accent); color: #fff; border-color: var(--accent);
  box-shadow: 0 4px 12px var(--accent-glow);
}
.cat-tab .cat-emoji { font-size: 18px; }
.cat-tab .cat-name { font-size: 11px; font-weight: 600; font-family: 'Space Grotesk', sans-serif; }

.materials-section { padding: 4px 14px 20px; }
.materials-section h4 {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 10px; font-weight: 700;
  text-transform: uppercase; letter-spacing: 1.5px;
  color: var(--text-muted); margin-bottom: 10px; padding-left: 4px;
}

.material-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
.material-card {
  cursor: pointer; border-radius: 10px; overflow: hidden;
  border: 1px solid var(--border); background: var(--bg-2);
  transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1); position: relative;
}
.material-card:hover { transform: translateY(-2px); border-color: var(--border-strong); box-shadow: var(--shadow); }
.material-card.selected {
  border-color: var(--accent);
  box-shadow: 0 0 0 2px var(--accent-glow), var(--shadow);
}
.material-preview { height: 60px; width: 100%; }
.material-name {
  padding: 6px 8px; font-size: 11px; font-weight: 600;
  color: var(--text-2); text-align: center;
  font-family: 'Space Grotesk', sans-serif;
  background: var(--bg-2); border-top: 1px solid var(--border);
}
.material-card.selected .material-name { color: var(--accent); }

.main { display: grid; grid-template-rows: auto 1fr auto; overflow: hidden; }

.canvas-wrap {
  background: var(--canvas-bg);
  background-image:
    linear-gradient(var(--canvas-grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--canvas-grid) 1px, transparent 1px);
  background-size: 24px 24px;
  display: flex; align-items: center; justify-content: center;
  padding: 30px; overflow: auto; position: relative;
}
#preview-element {
  display: flex; align-items: center; justify-content: center;
  font-family: 'Inter', sans-serif; font-weight: 700;
  color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,0.2);
  transition: all 0.3s ease; position: relative;
}
.preview-empty {
  color: var(--text-dim); font-size: 14px; text-align: center; padding: 60px;
  background: none !important; box-shadow: none !important; border: none !important;
}
.preview-empty i { font-size: 40px; display: block; margin-bottom: 12px; opacity: 0.4; }

.controls-bar {
  padding: 12px 20px; background: var(--bg-2);
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
}
.element-tabs {
  display: flex; gap: 3px; background: var(--bg-3);
  padding: 3px; border-radius: 8px; border: 1px solid var(--border);
}
.elem-tab {
  padding: 6px 10px; border-radius: 5px;
  border: none; background: transparent;
  color: var(--text-muted);
  font-family: 'Inter', sans-serif; font-size: 11px; font-weight: 500;
  cursor: pointer; transition: all 0.15s;
  display: flex; align-items: center; gap: 5px;
}
.elem-tab:hover { color: var(--text); }
.elem-tab.active { background: var(--bg-2); color: var(--text); box-shadow: var(--shadow-sm); }

.hue-control { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 200px; max-width: 360px; }
.hue-control label {
  font-size: 11px; color: var(--text-muted); font-weight: 600;
  text-transform: uppercase; letter-spacing: 0.5px;
}
.hue-slider {
  flex: 1; -webkit-appearance: none; appearance: none;
  height: 8px; border-radius: 4px; outline: none; cursor: pointer;
  background: linear-gradient(to right,
    hsl(0,80%,60%), hsl(60,80%,60%), hsl(120,80%,60%),
    hsl(180,80%,60%), hsl(240,80%,60%), hsl(300,80%,60%), hsl(360,80%,60%));
}
.hue-slider::-webkit-slider-thumb {
  -webkit-appearance: none; appearance: none;
  width: 18px; height: 18px; border-radius: 50%;
  background: #fff; cursor: pointer; border: 2px solid var(--bg-2);
  box-shadow: 0 2px 6px rgba(0,0,0,0.25);
}
.hue-slider::-moz-range-thumb {
  width: 18px; height: 18px; border-radius: 50%;
  background: #fff; cursor: pointer; border: 2px solid var(--bg-2);
  box-shadow: 0 2px 6px rgba(0,0,0,0.25);
}
.hue-val { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--text-2); min-width: 36px; text-align: right; font-weight: 600; }
.reset-hue {
  background: none; border: 1px solid var(--border); border-radius: 6px;
  padding: 6px 8px; color: var(--text-muted); cursor: pointer;
  font-size: 10px; transition: all 0.15s;
}
.reset-hue:hover { background: var(--bg-hover); color: var(--text); }

.settings-panel {
  background: var(--bg-2); border-top: 1px solid var(--border);
  max-height: 42vh; overflow-y: auto;
  scrollbar-width: thin; scrollbar-color: var(--border-strong) transparent;
}
.settings-panel::-webkit-scrollbar { width: 6px; }
.settings-panel::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 3px; }

.settings-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 20px 10px; position: sticky; top: 0;
  background: var(--bg-2); border-bottom: 1px solid var(--border);
  z-index: 10; flex-wrap: wrap; gap: 10px;
}
.settings-title { display: flex; align-items: center; gap: 10px; }
.settings-title h3 { font-family: 'Space Grotesk', sans-serif; font-size: 14px; font-weight: 700; color: var(--text); }
.settings-title .style-name {
  font-size: 12px; color: var(--text-muted); font-weight: 500;
  padding: 3px 10px; border-radius: 999px;
  background: var(--bg-3); border: 1px solid var(--border);
}

.export-tabs { display: flex; gap: 4px; background: var(--bg-3); padding: 3px; border-radius: 7px; border: 1px solid var(--border); }
.export-tab {
  padding: 6px 12px; border-radius: 5px; border: none; background: transparent;
  color: var(--text-muted);
  font-family: 'Inter', sans-serif; font-size: 11px; font-weight: 600;
  cursor: pointer; transition: all 0.15s;
  display: flex; align-items: center; gap: 5px;
}
.export-tab:hover { color: var(--text); }
.export-tab.active { background: var(--bg-2); color: var(--text); box-shadow: var(--shadow-sm); }

.settings-body { padding: 16px 20px 20px; }

.settings-block {
  margin-bottom: 14px;
  background: var(--bg-3);
  border: 1px solid var(--border);
  border-radius: 10px; overflow: hidden;
}
.settings-block-header {
  display: flex; align-items: center; gap: 8px;
  padding: 10px 14px;
  background: var(--bg-2); border-bottom: 1px solid var(--border);
  font-family: 'Space Grotesk', sans-serif;
  font-size: 11px; font-weight: 700;
  text-transform: uppercase; letter-spacing: 1px;
  color: var(--text-2);
}
.settings-block-header .block-icon {
  width: 20px; height: 20px; border-radius: 5px;
  display: flex; align-items: center; justify-content: center;
  color: #fff; font-size: 9px;
}
.settings-block-body { padding: 10px 14px; display: flex; flex-direction: column; gap: 6px; }
.settings-row {
  display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 5px 0;
}
.settings-row + .settings-row { border-top: 1px solid var(--border); }
.settings-row .key { font-size: 11px; color: var(--text-muted); font-weight: 500; min-width: 90px; }
.settings-row .value {
  display: flex; align-items: center; gap: 8px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px; color: var(--text); font-weight: 500;
  flex: 1; justify-content: flex-end;
}
.color-chip { width: 18px; height: 18px; border-radius: 4px; border: 1px solid var(--border-strong); flex-shrink: 0; }
.copy-btn {
  width: 24px; height: 24px; border-radius: 5px;
  border: 1px solid var(--border); background: var(--bg-2); color: var(--text-muted);
  cursor: pointer; font-size: 10px;
  display: flex; align-items: center; justify-content: center; transition: all 0.15s;
}
.copy-btn:hover { background: var(--accent); color: #fff; border-color: var(--accent); }
.copy-btn.copied { background: var(--success); color: #fff; border-color: var(--success); }

.code-block {
  background: var(--bg-3); border: 1px solid var(--border);
  border-radius: 10px; padding: 14px;
  font-family: 'JetBrains Mono', monospace; font-size: 12px;
  color: var(--text-2); white-space: pre-wrap; overflow-x: auto;
  line-height: 1.6; max-height: 300px; overflow-y: auto;
}
.code-actions { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.code-btn {
  padding: 8px 14px; border-radius: 7px;
  background: var(--accent); color: #fff; border: none;
  font-family: 'Inter', sans-serif; font-size: 12px; font-weight: 600;
  cursor: pointer; display: inline-flex; align-items: center; gap: 6px;
  transition: all 0.15s;
}
.code-btn:hover { background: var(--accent-2); transform: translateY(-1px); }
.code-btn.success { background: var(--success); }

.icon-fill { background: linear-gradient(135deg, #3b82f6, #8b5cf6); }
.icon-stroke { background: linear-gradient(135deg, #10b981, #06b6d4); }
.icon-effect { background: linear-gradient(135deg, #1f2937, #000); }
.icon-corner { background: linear-gradient(135deg, #ec4899, #a855f7); }

.toast-stack {
  position: fixed; bottom: 24px; right: 24px;
  display: flex; flex-direction: column-reverse; gap: 8px;
  z-index: 9999; pointer-events: none;
}
.toast {
  background: var(--bg-2); border: 1px solid var(--border);
  box-shadow: var(--shadow-lg); border-radius: 10px;
  padding: 12px 16px; display: flex; align-items: center; gap: 10px;
  font-size: 13px; font-weight: 500;
  animation: slideIn 0.3s ease, fadeOut 0.3s 2s ease forwards;
  pointer-events: all;
}
@keyframes slideIn { from { transform: translateX(20px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
@keyframes fadeOut { to { opacity: 0; transform: translateX(20px); } }

@media(max-width: 900px) {
  body { overflow: auto; height: auto; }
  .workspace { grid-template-columns: 1fr; height: auto; }
  .sidebar { border-right: none; border-bottom: 1px solid var(--border); max-height: none; }
  .category-tabs { grid-template-columns: repeat(4, 1fr); }
  .material-grid { grid-template-columns: repeat(3, 1fr); }
  .controls-bar { flex-direction: column; align-items: stretch; }
  .hue-control { width: 100%; max-width: none; }
  .canvas-wrap { min-height: 280px; padding: 20px; }
  .settings-panel { max-height: none; }
}
@media(max-width: 500px) {
  .material-grid { grid-template-columns: repeat(2, 1fr); }
  .element-tabs { overflow-x: auto; }
  .elem-tab { white-space: nowrap; }
}
</style>
</head>
<body>

<header class="topbar">
  <a href="#" class="brand">
    <div class="brand-logo"><i class="fa-solid fa-wand-magic-sparkles"></i></div>
    <span>Polish<span class="pro">UI</span></span>
  </a>
  <div class="topbar-divider"></div>
  <span class="topbar-info">
    <i class="fa-solid fa-bookmark"></i>
    UI Style Reference
  </span>
  <div class="topbar-actions">
    <button class="btn-ghost" onclick="showHelp()">
      <i class="fa-regular fa-circle-question"></i> Help
    </button>
    <button class="icon-btn" onclick="toggleTheme()" title="Toggle theme">
      <i class="fa-regular fa-moon" id="themeIcon"></i>
    </button>
  </div>
</header>

<div class="workspace">

  <aside class="sidebar">
    <div class="sidebar-header"><h3>Categories</h3></div>
    <div class="category-tabs" id="category-tabs"></div>
    <div class="materials-section">
      <h4 id="materials-heading">Styles</h4>
      <div class="material-grid" id="material-grid"></div>
    </div>
  </aside>

  <main class="main">
    <div class="controls-bar">
      <div class="element-tabs" id="element-tabs">
        <button class="elem-tab active" data-element="button"><i class="fa-solid fa-square"></i> Button</button>
        <button class="elem-tab" data-element="card"><i class="fa-solid fa-id-card"></i> Card</button>
        <button class="elem-tab" data-element="frame"><i class="fa-regular fa-square"></i> Frame</button>
        <button class="elem-tab" data-element="panel"><i class="fa-solid fa-window-maximize"></i> Panel</button>
        <button class="elem-tab" data-element="badge"><i class="fa-solid fa-certificate"></i> Badge</button>
        <button class="elem-tab" data-element="container"><i class="fa-solid fa-box"></i> Container</button>
        <button class="elem-tab" data-element="icon"><i class="fa-solid fa-circle"></i> Icon BG</button>
      </div>
      
      <div class="hue-control">
        <label>Hue</label>
        <input type="range" class="hue-slider" id="hue-slider" min="-180" max="180" value="0">
        <span class="hue-val" id="hue-val">0°</span>
        <button class="reset-hue" onclick="resetHue()" title="Reset hue">
          <i class="fa-solid fa-rotate-left"></i>
        </button>
      </div>
    </div>

    <div class="canvas-wrap">
      <div id="preview-element">
        <div class="preview-empty">
          <i class="fa-solid fa-hand-pointer"></i>
          <div>Pick a style from the left to start</div>
        </div>
      </div>
    </div>

    <div class="settings-panel">
      <div class="settings-header">
        <div class="settings-title">
          <h3>Style Settings</h3>
          <span class="style-name" id="style-name-display">No style selected</span>
        </div>
        <div class="export-tabs" id="export-tabs">
          <button class="export-tab active" data-tab="figma"><i class="fa-brands fa-figma"></i> Figma</button>
          <button class="export-tab" data-tab="css"><i class="fa-brands fa-css3-alt"></i> CSS</button>
          <button class="export-tab" data-tab="lua"><i class="fa-solid fa-cube"></i> Roblox Lua</button>
        </div>
      </div>
      <div class="settings-body" id="settings-body">
        <p style="color: var(--text-muted); font-size: 13px; text-align: center; padding: 40px 0;">
          <i class="fa-solid fa-arrow-left" style="margin-right: 8px;"></i>
          Select a material from the sidebar to view its settings
        </p>
      </div>
    </div>
  </main>
</div>

<div class="toast-stack" id="toast-stack"></div>

<script>
/* ═══════════════════════════════════════════
   MATERIALS DATABASE — 40 styles
   ═══════════════════════════════════════════ */

// HSL based so hue shift works
// fill: { type, angle, stops:[{h,s,l,pos}] }
// stroke: { h,s,l,a, width, position }
// effects: [{ type:'inner-shadow'|'drop-shadow', h,s,l,a, x,y,blur,spread }]
// radius: px

const MATERIALS = {
  anime: [
    {
      id: 'sakura', name: 'Sakura',
      fill: { type: 'linear', angle: 135, stops: [
        { h: 340, s: 100, l: 88, pos: 0 },
        { h: 330, s: 90, l: 75, pos: 100 }
      ]},
      stroke: { h: 340, s: 80, l: 65, a: 100, width: 1, position: 'inside' },
      effects: [
        { type: 'inner-shadow', h: 0, s: 0, l: 100, a: 60, x: 0, y: 1, blur: 0, spread: 0 },
        { type: 'drop-shadow', h: 340, s: 70, l: 60, a: 30, x: 0, y: 4, blur: 12, spread: 0 }
      ],
      radius: 14
    },
    {
      id: 'pastel-dream', name: 'Pastel Dream',
      fill: { type: 'linear', angle: 180, stops: [
        { h: 200, s: 100, l: 92, pos: 0 },
        { h: 280, s: 80, l: 88, pos: 100 }
      ]},
      stroke: { h: 240, s: 50, l: 80, a: 100, width: 1, position: 'inside' },
      effects: [
        { type: 'inner-shadow', h: 0, s: 0, l: 100, a: 80, x: 0, y: 1, blur: 0, spread: 0 },
        { type: 'drop-shadow', h: 240, s: 60, l: 70, a: 25, x: 0, y: 6, blur: 16, spread: 0 }
      ],
      radius: 16
    },
    {
      id: 'magic-glow', name: 'Magic Glow',
      fill: { type: 'linear', angle: 135, stops: [
        { h: 280, s: 100, l: 75, pos: 0 },
        { h: 240, s: 100, l: 65, pos: 100 }
      ]},
      stroke: { h: 0, s: 0, l: 100, a: 40, width: 1, position: 'inside' },
      effects: [
        { type: 'drop-shadow', h: 270, s: 100, l: 60, a: 60, x: 0, y: 0, blur: 24, spread: 0 },
        { type: 'drop-shadow', h: 270, s: 100, l: 70, a: 40, x: 0, y: 0, blur: 48, spread: 0 }
      ],
      radius: 12
    },
    {

const CATEGORIES = [
  { id: 'anime', emoji: '🌸', name: 'Anime' },
  { id: 'cartoon', emoji: '🎨', name: 'Cartoon' },
  { id: 'premium', emoji: '💎', name: 'Premium' },
  { id: 'rpg', emoji: '⚔️', name: 'RPG' }
];

/* ═══════════════════════════════════════════
   STATE
   ═══════════════════════════════════════════ */
let currentCategory = 'premium';
let currentMaterialId = null;
let currentElement = 'button';
let currentExportTab = 'figma';
let hueShift = 0;

/* ═══════════════════════════════════════════
   HELPERS
   ═══════════════════════════════════════════ */

function hslToHex(h, s, l) {
  h = ((h % 360) + 360) % 360;
  l /= 100;
  const a = s * Math.min(l, 1 - l) / 100;
  const f = n => {
    const k = (n + h / 30) % 12;
    const color = l - a * Math.max(Math.min(k - 3, 9 - k, 1), -1);
    return Math.round(255 * color).toString(16).padStart(2, '0');
  };
  return `#${f(0)}${f(8)}${f(4)}`;
}

function hslToRgb(h, s, l) {
  h = ((h % 360) + 360) % 360;
  l /= 100;
  const a = s * Math.min(l, 1 - l) / 100;
  const f = n => {
    const k = (n + h / 30) % 12;
    const color = l - a * Math.max(Math.min(k - 3, 9 - k, 1), -1);
    return Math.round(255 * color);
  };
  return { r: f(0), g: f(8), b: f(4) };
}

function shiftedH(originalH) {
  return ((originalH + hueShift) % 360 + 360) % 360;
}

function hslaCss(h, s, l, a) {
  return `hsla(${shiftedH(h)}, ${s}%, ${l}%, ${(a || 100) / 100})`;
}

/* ═══════════════════════════════════════════
   RENDER CATEGORIES
   ═══════════════════════════════════════════ */
function renderCategories() {
  const container = document.getElementById('category-tabs');
  container.innerHTML = CATEGORIES.map(cat => `
    <div class="cat-tab ${cat.id === currentCategory ? 'active' : ''}" 
         onclick="selectCategory('${cat.id}')">
      <div class="cat-emoji">${cat.emoji}</div>
      <div class="cat-name">${cat.name}</div>
    </div>
  `).join('');
}

function selectCategory(catId) {
  currentCategory = catId;
  renderCategories();
  renderMaterials();
  const cat = CATEGORIES.find(c => c.id === catId);
  document.getElementById('materials-heading').textContent = cat.name + ' Styles';
}

/* ═══════════════════════════════════════════
   RENDER MATERIALS
   ═══════════════════════════════════════════ */
function renderMaterials() {
  const container = document.getElementById('material-grid');
  const mats = MATERIALS[currentCategory] || [];
  container.innerHTML = mats.map(mat => {
    const previewCss = buildPreviewCss(mat);
    return `
      <div class="material-card ${mat.id === currentMaterialId ? 'selected' : ''}" 
           onclick="selectMaterial('${mat.id}')">
        <div class="material-preview" style="${previewCss}"></div>
        <div class="material-name">${mat.name}</div>
      </div>
    `;
  }).join('');
}

function buildPreviewCss(mat) {
  // Mini preview - sadece fill
  let bg = '';
  if (mat.fill.type === 'solid') {
    bg = hslaCss(mat.fill.stops[0].h, mat.fill.stops[0].s, mat.fill.stops[0].l, 100);
  } else if (mat.fill.type === 'linear') {
    const stops = mat.fill.stops.map(s => `${hslaCss(s.h, s.s, s.l, 100)} ${s.pos}%`).join(', ');
    bg = `linear-gradient(${mat.fill.angle}deg, ${stops})`;
  } else if (mat.fill.type === 'radial') {
    const stops = mat.fill.stops.map(s => `${hslaCss(s.h, s.s, s.l, 100)} ${s.pos}%`).join(', ');
    bg = `radial-gradient(circle, ${stops})`;
  }
  return `background: ${bg};`;
}

function selectMaterial(matId) {
  currentMaterialId = matId;
  renderMaterials();
  applyMaterial();
  renderSettings();
}

/* ═══════════════════════════════════════════
   APPLY MATERIAL TO PREVIEW
   ═══════════════════════════════════════════ */
function applyMaterial() {
  const mat = getCurrentMaterial();
  const el = document.getElementById('preview-element');
  if (!mat) return;
  
  el.innerHTML = '';
  el.style.cssText = '';
  
  const configs = {
    button:    { w: '160px', h: '52px',  text: 'Button',    fs: '14px' },
    card:      { w: '240px', h: '300px', text: 'Card',      fs: '16px' },
    frame:     { w: '320px', h: '200px', text: 'Frame',     fs: '14px' },
    panel:     { w: '380px', h: '240px', text: 'Panel',     fs: '15px' },
    badge:     { w: '90px',  h: '32px',  text: 'NEW',       fs: '11px' },
    container: { w: '300px', h: '180px', text: 'Container', fs: '14px' },
    icon:      { w: '72px',  h: '72px',  text: '★',         fs: '28px' }
  };
  const cfg = configs[currentElement];
  
  // Background (Fill)
  let bg = '';
  if (mat.fill.type === 'solid') {
    bg = hslaCss(mat.fill.stops[0].h, mat.fill.stops[0].s, mat.fill.stops[0].l, 100);
  } else if (mat.fill.type === 'linear') {
    const stops = mat.fill.stops.map(s => `${hslaCss(s.h, s.s, s.l, 100)} ${s.pos}%`).join(', ');
    bg = `linear-gradient(${mat.fill.angle}deg, ${stops})`;
  } else if (mat.fill.type === 'radial') {
    const stops = mat.fill.stops.map(s => `${hslaCss(s.h, s.s, s.l, 100)} ${s.pos}%`).join(', ');
    bg = `radial-gradient(circle, ${stops})`;
  }
  el.style.background = bg;
  
  // Border (Stroke)
  if (mat.stroke && mat.stroke.width > 0) {
    el.style.border = `${mat.stroke.width}px solid ${hslaCss(mat.stroke.h, mat.stroke.s, mat.stroke.l, mat.stroke.a)}`;
  } else {
    el.style.border = 'none';
  }
  
  // Effects (shadows)
  const shadows = [];
  if (mat.effects) {
    mat.effects.forEach(fx => {
      const color = hslaCss(fx.h, fx.s, fx.l, fx.a);
      if (fx.type === 'inner-shadow') {
        shadows.push(`inset ${fx.x}px ${fx.y}px ${fx.blur}px ${fx.spread || 0}px ${color}`);
      } else if (fx.type === 'drop-shadow') {
        shadows.push(`${fx.x}px ${fx.y}px ${fx.blur}px ${fx.spread || 0}px ${color}`);
      }
    });
  }
  el.style.boxShadow = shadows.length ? shadows.join(', ') : 'none';
  
  // Radius
  el.style.borderRadius = (mat.radius || 8) + 'px';
  
  // Size & text
  el.style.width = cfg.w;
  el.style.height = cfg.h;
  el.style.fontSize = cfg.fs;
  el.style.display = 'flex';
  el.style.alignItems = 'center';
  el.style.justifyContent = 'center';
  el.style.color = '#fff';
  el.style.fontWeight = '700';
  el.style.textShadow = '0 1px 2px rgba(0,0,0,0.3)';
  el.textContent = cfg.text;
  
  // Update name
  document.getElementById('style-name-display').textContent = mat.name;
}

function getCurrentMaterial() {
  if (!currentMaterialId) return null;
  return MATERIALS[currentCategory].find(m => m.id === currentMaterialId);

function renderSettings() {
  const mat = getCurrentMaterial();
  const body = document.getElementById('settings-body');
  if (!mat) {
    body.innerHTML = `
      <p style="color: var(--text-muted); font-size: 13px; text-align: center; padding: 40px 0;">
        <i class="fa-solid fa-arrow-left" style="margin-right: 8px;"></i>
        Select a material from the sidebar to view its settings
      </p>`;
    return;
  }
  
  if (currentExportTab === 'figma') {
    body.innerHTML = renderFigmaSettings(mat);
  } else if (currentExportTab === 'css') {
    body.innerHTML = renderCssSettings(mat);
  } else if (currentExportTab === 'lua') {
    body.innerHTML = renderLuaSettings(mat);
  }
}

/* ── FIGMA VIEW ── */
function renderFigmaSettings(mat) {
  let html = '';
  
  // FILL block
  html += `<div class="settings-block">
    <div class="settings-block-header">
      <span class="block-icon icon-fill"><i class="fa-solid fa-fill-drip"></i></span>
      Fill
    </div>
    <div class="settings-block-body">`;
  
  if (mat.fill.type === 'solid') {
    const c = mat.fill.stops[0];
    const hex = hslToHex(shiftedH(c.h), c.s, c.l);
    html += rowWithCopy('Type', 'Solid');
    html += colorRow('Color', hex);
  } else {
    const typeName = mat.fill.type.charAt(0).toUpperCase() + mat.fill.type.slice(1) + ' Gradient';
    html += rowWithCopy('Type', typeName);
    if (mat.fill.type === 'linear' || mat.fill.type === 'conic') {
      html += rowWithCopy('Angle', mat.fill.angle + '°');
    }
    mat.fill.stops.forEach((s, i) => {
      const hex = hslToHex(shiftedH(s.h), s.s, s.l);
      html += colorRow(`Stop ${i + 1} (at ${s.pos}%)`, hex);
    });
  }
  html += `</div></div>`;
  
  // STROKE block
  if (mat.stroke && mat.stroke.width > 0) {
    const hex = hslToHex(shiftedH(mat.stroke.h), mat.stroke.s, mat.stroke.l);
    html += `<div class="settings-block">
      <div class="settings-block-header">
        <span class="block-icon icon-stroke"><i class="fa-regular fa-square"></i></span>
        Stroke
      </div>
      <div class="settings-block-body">
        ${colorRow('Color', hex, mat.stroke.a)}
        ${rowWithCopy('Weight', mat.stroke.width + 'px')}
        ${rowWithCopy('Position', mat.stroke.position || 'Inside')}
      </div>
    </div>`;
  }
  
  // EFFECTS block
  if (mat.effects && mat.effects.length) {
    mat.effects.forEach((fx, i) => {
      const isInner = fx.type === 'inner-shadow';
      const hex = hslToHex(shiftedH(fx.h), fx.s, fx.l);
      html += `<div class="settings-block">
        <div class="settings-block-header">
          <span class="block-icon icon-effect"><i class="fa-solid ${isInner ? 'fa-circle-half-stroke' : 'fa-clone'}"></i></span>
          ${isInner ? 'Inner Shadow' : 'Drop Shadow'} ${mat.effects.length > 1 ? '#' + (i + 1) : ''}
        </div>
        <div class="settings-block-body">
          ${colorRow('Color', hex, fx.a)}
          ${rowWithCopy('X', fx.x + 'px')}
          ${rowWithCopy('Y', fx.y + 'px')}
          ${rowWithCopy('Blur', fx.blur + 'px')}
          ${rowWithCopy('Spread', (fx.spread || 0) + 'px')}
        </div>
      </div>`;
    });
  }
  
  // CORNER RADIUS
  html += `<div class="settings-block">
    <div class="settings-block-header">
      <span class="block-icon icon-corner"><i class="fa-solid fa-vector-square"></i></span>
      Corner Radius
    </div>
    <div class="settings-block-body">
      ${rowWithCopy('Radius', mat.radius + 'px')}
    </div>
  </div>`;
  
  // COPY ALL
  html += `
    <div class="code-actions" style="margin-top: 6px;">
      <button class="code-btn" onclick="copyAllFigma()">
        <i class="fa-solid fa-copy"></i> Copy All Settings
      </button>
    </div>
  `;
  
  return html;
}

function rowWithCopy(key, value) {
  return `
    <div class="settings-row">
      <span class="key">${key}</span>
      <span class="value">
        ${value}
        <button class="copy-btn" onclick="copyText('${escapeAttr(value)}', this)" title="Copy">
          <i class="fa-regular fa-copy"></i>
        </button>
      </span>
    </div>`;
}

function colorRow(key, hex, opacity) {
  const display = opacity !== undefined && opacity < 100 ? `${hex} · ${opacity}%` : hex;
  return `
    <div class="settings-row">
      <span class="key">${key}</span>
      <span class="value">
        <span class="color-chip" style="background:${hex};"></span>
        ${display}
        <button class="copy-btn" onclick="copyText('${hex}', this)" title="Copy hex">
          <i class="fa-regular fa-copy"></i>
        </button>
      </span>
    </div>`;
}

function escapeAttr(s) {
  return String(s).replace(/'/g, "\\'").replace(/"/g, '&quot;');
}

/* ── CSS VIEW ── */
function renderCssSettings(mat) {
  const css = buildCssCode(mat);
  return `
    <div class="code-block">${escapeHtml(css)}</div>
    <div class="code-actions">
      <button class="code-btn" onclick="copyText(\`${css.replace(/`/g, '\\`')}\`, this)">
        <i class="fa-solid fa-copy"></i> Copy CSS
      </button>
    </div>
  `;
}

function buildCssCode(mat) {
  let bg = '';
  if (mat.fill.type === 'solid') {
    bg = hslToHex(shiftedH(mat.fill.stops[0].h), mat.fill.stops[0].s, mat.fill.stops[0].l);
  } else if (mat.fill.type === 'linear') {
    const stops = mat.fill.stops.map(s => `${hslToHex(shiftedH(s.h), s.s, s.l)} ${s.pos}%`).join(', ');
    bg = `linear-gradient(${mat.fill.angle}deg, ${stops})`;
  } else if (mat.fill.type === 'radial') {
    const stops = mat.fill.stops.map(s => `${hslToHex(shiftedH(s.h), s.s, s.l)} ${s.pos}%`).join(', ');
    bg = `radial-gradient(circle, ${stops})`;
  }
  
  let css = `.${mat.id} {\n  background: ${bg};\n`;
  
  if (mat.stroke && mat.stroke.width > 0) {
    const rgba = hslaCssExport(mat.stroke.h, mat.stroke.s, mat.stroke.l, mat.stroke.a);
    css += `  border: ${mat.stroke.width}px solid ${rgba};\n`;
  }
  
  if (mat.effects && mat.effects.length) {
    const shadows = mat.effects.map(fx => {
      const color = hslaCssExport(fx.h, fx.s, fx.l, fx.a);
      if (fx.type === 'inner-shadow') {
        return `inset ${fx.x}px ${fx.y}px ${fx.blur}px ${fx.spread || 0}px ${color}`;
      } else {
        return `${fx.x}px ${fx.y}px ${fx.blur}px ${fx.spread || 0}px ${color}`;
      }
    });
    css += `  box-shadow:\n    ${shadows.join(',\n    ')};\n`;
  }
  
  css += `  border-radius: ${mat.radius}px;\n}`;
  return css;
}

function hslaCssExport(h, s, l, a) {
  const { r, g, b } = hslToRgb(shiftedH(h), s, l);
  return `rgba(${r}, ${g}, ${b}, ${(a || 100) / 100})`;
}

/* ── LUA VIEW (Roblox) ── */
function renderLuaSettings(mat) {
  const lua = buildLuaCode(mat);
  return `
    <div class="code-block">${escapeHtml(lua)}</div>
    <div class="code-actions">
      <button class="code-btn" onclick="copyText(\`${lua.replace(/`/g, '\\`')}\`, this)">
        <i class="fa-solid fa-copy"></i> Copy Lua
      </button>
    </div>
  `;
}

function buildLuaCode(mat) {
  const name = mat.id.replace(/-/g, '_');
  let lua = `-- PolishUI: ${mat.name}\n`;
  lua += `local frame = Instance.new("Frame")\n`;
  lua += `frame.Name = "${mat.name}"\n`;
  lua += `frame.Size = UDim2.new(0, 200, 0, 60)\n`;
  lua += `frame.AnchorPoint = Vector2.new(0.5, 0.5)\n`;
  lua += `frame.Position = UDim2.new(0.5, 0, 0.5, 0)\n`;
  
  // BG color (main)
  const main = mat.fill.stops[Math.floor(mat.fill.stops.length / 2)];
  const rgb = hslToRgb(shiftedH(main.h), main.s, main.l);
  lua += `frame.BackgroundColor3 = Color3.fromRGB(${rgb.r}, ${rgb.g}, ${rgb.b})\n`;
  lua += `frame.BorderSizePixel = 0\n\n`;
  
  // Corner radius
  lua += `local corner = Instance.new("UICorner")\n`;
  lua += `corner.CornerRadius = UDim.new(0, ${mat.radius})\n`;
  lua += `corner.Parent = frame\n\n`;
  
  // Gradient
  if (mat.fill.type !== 'solid' && mat.fill.stops.length >= 2) {
    lua += `local gradient = Instance.new("UIGradient")\n`;
    const seq = mat.fill.stops.map(s => {
      const c = hslToRgb(shiftedH(s.h), s.s, s.l);
      const t = (s.pos / 100).toFixed(2);
      return `ColorSequenceKeypoint.new(${t}, Color3.fromRGB(${c.r}, ${c.g}, ${c.b}))`;
    }).join(',\n  ');
    lua += `gradient.Color = ColorSequence.new({\n  ${seq}\n})\n`;
    
    let rot = 0;
    if (mat.fill.type === 'linear') rot = mat.fill.angle - 90; // Roblox 0deg = top to bottom
    lua += `gradient.Rotation = ${rot}\n`;
    lua += `gradient.Parent = frame\n\n`;
  }
  
  // Stroke
  if (mat.stroke && mat.stroke.width > 0) {
    const sc = hslToRgb(shiftedH(mat.stroke.h), mat.stroke.s, mat.stroke.l);
    lua += `local stroke = Instance.new("UIStroke")\n`;
    lua += `stroke.Color = Color3.fromRGB(${sc.r}, ${sc.g}, ${sc.b})\n`;
    lua += `stroke.Thickness = ${mat.stroke.width}\n`;
    lua += `stroke.Transparency = ${(1 - (mat.stroke.a || 100) / 100).toFixed(2)}\n`;
    lua += `stroke.ApplyStrokeMode = Enum.ApplyStrokeMode.Border\n`;
    lua += `stroke.Parent = frame\n\n`;
  }
  
  // Drop shadow (Roblox uses ImageLabel)
  const dropShadow = (mat.effects || []).find(fx => fx.type === 'drop-shadow');
  if (dropShadow) {
    const sc = hslToRgb(shiftedH(dropShadow.h), dropShadow.s, dropShadow.l);
    lua += `-- Drop Shadow (use ImageLabel with shadow asset)\n`;
    lua += `-- Color: Color3.fromRGB(${sc.r}, ${sc.g}, ${sc.b})\n`;
    lua += `-- Transparency: ${(1 - dropShadow.a / 100).toFixed(2)}\n`;
    lua += `-- Offset: X=${dropShadow.x}, Y=${dropShadow.y}\n`;
    lua += `-- Blur (use ImageRectSize): ${dropShadow.blur}px\n\n`;
  }
  
  lua += `frame.Parent = script.Parent`;
  return lua;
}

/* ═══════════════════════════════════════════
   COPY HELPERS
   ═══════════════════════════════════════════ */
function copyText(text, btn) {
  navigator.clipboard.writeText(text).then(() => {
    if (btn) {
      btn.classList.add('copied');
      const icon = btn.innerHTML;
      btn.innerHTML = '<i class="fa-solid fa-check"></i>';
      setTimeout(() => {
        btn.classList.remove('copied');
        btn.innerHTML = icon;
      }, 1500);
    }
    toast('Copied to clipboard', 'success');
  });
}

function copyAllFigma() {
  const mat = getCurrentMaterial();
  if (!mat) return;
  let txt = `═══ POLISHUI: ${mat.name.toUpperCase()} ═══\n\n`;
  
  // Fill
  txt += `▸ FILL\n`;
  if (mat.fill.type === 'solid') {
    txt += `  Type: Solid\n`;
    txt += `  Color: ${hslToHex(shiftedH(mat.fill.stops[0].h), mat.fill.stops[0].s, mat.fill.stops[0].l)}\n`;
  } else {
    txt += `  Type: ${mat.fill.type.charAt(0).toUpperCase() + mat.fill.type.slice(1)} Gradient\n`;
    if (mat.fill.type !== 'radial') txt += `  Angle: ${mat.fill.angle}°\n`;
    mat.fill.stops.forEach((s, i) => {
      txt += `  Stop ${i + 1}: ${hslToHex(shiftedH(s.h), s.s, s.l)} at ${s.pos}%\n`;
    });
  }
  
  // Stroke
  if (mat.stroke && mat.stroke.width > 0) {
    txt += `\n▸ STROKE\n`;
    txt += `  Color: ${hslToHex(shiftedH(mat.stroke.h), mat.stroke.s, mat.stroke.l)} (${mat.stroke.a}%)\n`;
    txt += `  Weight: ${mat.stroke.width}px\n`;
    txt += `  Position: ${mat.stroke.position || 'Inside'}\n`;
  }
  
  // Effects
  if (mat.effects && mat.effects.length) {
    mat.effects.forEach((fx, i) => {
      const isInner = fx.type === 'inner-shadow';
      txt += `\n▸ ${isInner ? 'INNER SHADOW' : 'DROP SHADOW'}${mat.effects.length > 1 ? ' #' + (i + 1) : ''}\n`;
      txt += `  Color: ${hslToHex(shiftedH(fx.h), fx.s, fx.l)} (${fx.a}%)\n`;
      txt += `  X: ${fx.x}px   Y: ${fx.y}px\n`;
      txt += `  Blur: ${fx.blur}px   Spread: ${fx.spread || 0}px\n`;
    });
  }
  
  // Radius
  txt += `\n▸ CORNER RADIUS: ${mat.radius}px\n`;
  
  navigator.clipboard.writeText(txt).then(() => {
    toast('All settings copied! Paste into Figma manually', 'success');
  });
}

function escapeHtml(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

/* ═══════════════════════════════════════════
   THEME
   ═══════════════════════════════════════════ */
function toggleTheme() {
  const html = document.documentElement;
  const current = html.getAttribute('data-theme');
  const next = current === 'light' ? 'dark' : 'light';
  html.setAttribute('data-theme', next);
  localStorage.setItem('polishui-theme', next);
  document.getElementById('themeIcon').className = next === 'light' ? 'fa-regular fa-moon' : 'fa-regular fa-sun';
}
(function() {
  const saved = localStorage.getItem('polishui-theme');
  if (saved) {
    document.documentElement.setAttribute('data-theme', saved);
    document.getElementById('themeIcon').className = saved === 'light' ? 'fa-regular fa-moon' : 'fa-regular fa-sun';
  }
})();

/* ═══════════════════════════════════════════
   TOAST + HELP
   ═══════════════════════════════════════════ */
function toast(msg, type) {
  const stack = document.getElementById('toast-stack');
  const t = document.createElement('div');
  t.className = 'toast';
  t.innerHTML = `
    <i class="fa-solid ${type === 'success' ? 'fa-circle-check' : 'fa-info-circle'}" 
       style="color: ${type === 'success' ? 'var(--success)' : 'var(--accent)'}"></i>
    <span>${msg}</span>
  `;
  stack.appendChild(t);
  setTimeout(() => t.remove(), 2500);
}

function showHelp() {
  toast('Pick category → choose style → copy settings to Figma/CSS/Lua', 'info');
}

   INIT
   ═══════════════════════════════════════════ */
renderCategories();
renderMaterials();

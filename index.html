<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PolishUI — UI Style Library</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%233b82f6'/%3E%3Cstop offset='1' stop-color='%238b5cf6'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='100' height='100' rx='22' fill='url(%23g)'/%3E%3Cpath d='M30 65 L50 25 L70 65 M38 50 L62 50' stroke='white' stroke-width='8' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root[data-theme="light"]{--bg:#fafafa;--bg-2:#fff;--bg-3:#f3f4f6;--hover:#f9fafb;--text:#111827;--text-2:#374151;--muted:#6b7280;--dim:#9ca3af;--border:#e5e7eb;--border-s:#d1d5db;--accent:#3b82f6;--accent-2:#2563eb;--glow:rgba(59,130,246,.15);--success:#10b981;--danger:#ef4444;--shadow:0 4px 12px rgba(0,0,0,.08);--shadow-lg:0 12px 30px rgba(0,0,0,.12);--canvas:#1a1a1f;--grid:rgba(255,255,255,.04)}
:root[data-theme="dark"]{--bg:#0a0a0b;--bg-2:#111114;--bg-3:#18181b;--hover:#1c1c20;--text:#f4f4f5;--text-2:#d4d4d8;--muted:#a1a1aa;--dim:#71717a;--border:rgba(255,255,255,.08);--border-s:rgba(255,255,255,.16);--accent:#60a5fa;--accent-2:#3b82f6;--glow:rgba(96,165,250,.2);--success:#34d399;--danger:#f87171;--shadow:0 4px 12px rgba(0,0,0,.4);--shadow-lg:0 12px 30px rgba(0,0,0,.5);--canvas:#050508;--grid:rgba(255,255,255,.03)}
*{margin:0;padding:0;box-sizing:border-box}html{background:var(--bg)}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;height:100vh;overflow:hidden;transition:background .3s,color .3s}
.topbar{height:54px;background:var(--bg-2);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 18px;gap:14px;z-index:100}
.brand{display:flex;align-items:center;gap:10px;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:16px;color:var(--text);text-decoration:none}
.brand-logo{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,#3b82f6,#8b5cf6);display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px;box-shadow:0 4px 14px rgba(59,130,246,.4)}
.brand .pro{color:var(--accent)}
.tb-info{font-size:12px;color:var(--muted);font-weight:500;display:flex;align-items:center;gap:6px}
.tb-divider{width:1px;height:22px;background:var(--border)}
.tb-actions{margin-left:auto;display:flex;align-items:center;gap:6px}
.icon-btn{width:34px;height:34px;border-radius:8px;border:1px solid var(--border);background:var(--bg-2);color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:13px;transition:all .15s}
.icon-btn:hover{background:var(--hover);color:var(--text);border-color:var(--border-s)}
.btn-ghost{padding:7px 13px;border-radius:7px;background:transparent;color:var(--text-2);border:1px solid var(--border);font-size:12px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:all .15s}
.btn-ghost:hover{background:var(--hover);border-color:var(--border-s)}
.workspace{display:grid;grid-template-columns:340px 1fr 280px;height:calc(100vh - 54px)}
.sidebar{background:var(--bg-2);border-right:1px solid var(--border);overflow-y:auto;scrollbar-width:thin;display:flex;flex-direction:column}
.sidebar::-webkit-scrollbar{width:6px}.sidebar::-webkit-scrollbar-thumb{background:var(--border-s);border-radius:3px}
.layer-tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:0;padding:10px;background:var(--bg-2);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:5}
.layer-tab{padding:9px 4px;border-radius:7px;border:none;background:transparent;color:var(--muted);cursor:pointer;font-size:11px;font-weight:700;transition:all .15s;display:flex;align-items:center;justify-content:center;gap:5px;text-transform:uppercase;letter-spacing:.5px}
.layer-tab:hover{color:var(--text);background:var(--bg-3)}
.layer-tab.active{background:var(--accent);color:#fff;box-shadow:0 2px 8px var(--glow)}
.search-wrap{padding:8px 12px;position:relative;border-bottom:1px solid var(--border);background:var(--bg-2)}
.search-input{width:100%;padding:8px 10px 8px 30px;border:1px solid var(--border);border-radius:7px;background:var(--bg-3);font-size:12px;color:var(--text);outline:none}
.search-input:focus{border-color:var(--accent);background:var(--bg-2)}
.search-wrap i.search-icon{position:absolute;left:22px;top:50%;transform:translateY(-50%);color:var(--dim);font-size:11px;pointer-events:none}
.cat-strip{display:flex;gap:5px;padding:8px 10px;overflow-x:auto;background:var(--bg-2);border-bottom:1px solid var(--border);scrollbar-width:none}
.cat-strip::-webkit-scrollbar{display:none}
.cat-chip{padding:5px 11px;border-radius:999px;border:1px solid var(--border);background:var(--bg-2);color:var(--text-2);font-size:11px;font-weight:600;cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:5px;transition:all .15s}
.cat-chip:hover{background:var(--hover);border-color:var(--border-s)}
.cat-chip.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.lib-section{padding:10px 12px 18px;flex:1}
.lib-section h4{font-family:'Space Grotesk',sans-serif;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted);margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
.lib-section h4 .count{font-family:'JetBrains Mono',monospace;color:var(--dim)}
.lib-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}
.lib-card{cursor:pointer;border-radius:8px;overflow:hidden;border:1px solid var(--border);background:var(--bg-2);transition:all .2s;position:relative}
.lib-card:hover{transform:translateY(-2px);border-color:var(--border-s);box-shadow:var(--shadow)}
.lib-card.selected{border-color:var(--accent);box-shadow:0 0 0 2px var(--glow)}
.lib-preview{height:54px;width:100%;display:flex;align-items:center;justify-content:center;background:#1a1a1f;position:relative;overflow:hidden}
.lib-preview .preview-box{width:62px;height:34px;display:flex;align-items:center;justify-content:center;border-radius:5px}
.lib-name{padding:5px 6px;font-size:10px;font-weight:600;color:var(--text-2);text-align:center;font-family:'Space Grotesk',sans-serif;background:var(--bg-2);border-top:1px solid var(--border)}
.lib-card.selected .lib-name{color:var(--accent)}
.fav-btn{position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:50%;background:rgba(0,0,0,.6);border:none;color:#fff;cursor:pointer;font-size:9px;display:flex;align-items:center;justify-content:center;opacity:0;transition:all .15s;z-index:2}
.lib-card:hover .fav-btn,.fav-btn.fav-on{opacity:1}
.fav-btn.fav-on{background:#fbbf24}
.empty-state{padding:30px 14px;text-align:center;color:var(--dim);font-size:11px;grid-column:1/-1}
.empty-state i{font-size:24px;display:block;margin-bottom:8px;opacity:.5}
.main{display:flex;flex-direction:column;overflow:hidden;background:var(--canvas)}
.stage-toolbar{padding:10px 16px;background:var(--bg-2);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.element-tabs{display:flex;gap:3px;background:var(--bg-3);padding:3px;border-radius:7px;border:1px solid var(--border)}
.elem-tab{padding:5px 9px;border-radius:5px;border:none;background:transparent;color:var(--muted);font-size:11px;font-weight:500;cursor:pointer;display:flex;align-items:center;gap:5px}
.elem-tab:hover{color:var(--text)}
.elem-tab.active{background:var(--bg-2);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.05)}
.bg-tabs{display:flex;gap:3px;background:var(--bg-3);padding:3px;border-radius:7px;border:1px solid var(--border)}
.bg-tab{width:24px;height:24px;border-radius:4px;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--muted);background:transparent}
.bg-tab:hover{color:var(--text)}
.bg-tab.active{background:var(--bg-2);color:var(--accent)}
.stage-canvas{flex:1;background:var(--canvas);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px;display:flex;align-items:center;justify-content:center;padding:30px;overflow:auto}
.stage-canvas.bg-white{background:#fff;background-image:none}
.stage-canvas.bg-black{background:#000;background-image:none}
.stage-canvas.bg-game{background:linear-gradient(135deg,#1e3c72,#2a5298);background-image:none}
.stage-canvas.bg-anime{background:linear-gradient(135deg,#fbc2eb 0%,#a6c1ee 100%);background-image:none}
#preview-element{position:relative;display:flex;align-items:center;justify-content:center;font-family:'Inter',sans-serif;font-weight:700;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.4);transition:all .3s ease}
.preview-empty{color:rgba(255,255,255,.4);font-size:14px;text-align:center;padding:60px;background:none!important;border:none!important;box-shadow:none!important}
.preview-empty i{font-size:42px;display:block;margin-bottom:12px;opacity:.4}
.preview-empty h2{font-family:'Space Grotesk',sans-serif;font-size:18px;margin-bottom:6px;color:rgba(255,255,255,.7)}
.sidebar-right{background:var(--bg-2);border-left:1px solid var(--border);overflow-y:auto;scrollbar-width:thin}
.sidebar-right::-webkit-scrollbar{width:6px}
.sidebar-right::-webkit-scrollbar-thumb{background:var(--border-s);border-radius:3px}
.layer-stack{padding:12px;border-bottom:1px solid var(--border)}
.layer-stack h3{font-family:'Space Grotesk',sans-serif;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted);margin-bottom:10px}
.layer-item{display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--bg-3);border:1px solid var(--border);border-radius:7px;margin-bottom:5px;font-size:12px;transition:all .15s}
.layer-item.has-value{border-color:var(--accent);background:rgba(59,130,246,.05)}
.layer-item .layer-icon{width:22px;height:22px;border-radius:5px;background:var(--bg-2);display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--muted)}
.layer-item.has-value .layer-icon{background:var(--accent);color:#fff}
.layer-item .layer-info{flex:1;min-width:0}
.layer-item .layer-label{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;font-weight:700}
.layer-item .layer-value{font-size:11px;font-weight:600;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.layer-item .clear-btn{width:18px;height:18px;border-radius:4px;border:none;background:transparent;color:var(--dim);cursor:pointer;font-size:9px;display:flex;align-items:center;justify-content:center}
.layer-item .clear-btn:hover{color:var(--danger);background:var(--hover)}
.props-section{padding:12px;border-bottom:1px solid var(--border)}
.props-section h3{font-family:'Space Grotesk',sans-serif;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted);margin-bottom:10px}
.prop-row{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.prop-row label{font-size:10px;color:var(--muted);font-weight:600;min-width:48px;text-transform:uppercase;letter-spacing:.5px}
.prop-row input[type="range"]{flex:1;-webkit-appearance:none;height:5px;background:var(--bg-3);border-radius:3px;outline:none;cursor:pointer}
.prop-row input[type="range"]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--accent);cursor:pointer;border:2px solid var(--bg-2)}
.prop-row .val{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--text-2);min-width:36px;text-align:right;font-weight:600}
.prop-row input[type="color"]{width:28px;height:24px;border:none;border-radius:5px;cursor:pointer;background:transparent;padding:0}
.hue-bar{flex:1;-webkit-appearance:none;height:8px;border-radius:4px;outline:none;cursor:pointer;background:linear-gradient(to right,hsl(0,80%,60%),hsl(60,80%,60%),hsl(120,80%,60%),hsl(180,80%,60%),hsl(240,80%,60%),hsl(300,80%,60%),hsl(360,80%,60%))}
.hue-bar::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:#fff;cursor:pointer;border:2px solid var(--bg-2)}
.export-panel{padding:12px}
.export-tabs{display:flex;gap:3px;background:var(--bg-3);padding:3px;border-radius:7px;border:1px solid var(--border);margin-bottom:10px}
.export-tab{flex:1;padding:6px 4px;border-radius:5px;border:none;background:transparent;color:var(--muted);font-size:10px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:4px}
.export-tab:hover{color:var(--text)}
.export-tab.active{background:var(--bg-2);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.05)}
.code-block{background:#0d1117;border:1px solid var(--border);border-radius:7px;padding:10px;font-family:'JetBrains Mono',monospace;font-size:10px;color:#d4d4d8;white-space:pre;overflow-x:auto;line-height:1.5;max-height:260px;overflow-y:auto}
.code-block .k{color:#79b8ff}.code-block .s{color:#9ecbff}.code-block .n{color:#ffab70}.code-block .c{color:#6a737d;font-style:italic}.code-block .p{color:#f97583}
.code-copy-btn{width:100%;margin-top:8px;padding:9px;background:var(--accent);color:#fff;border:none;border-radius:7px;font-size:11px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px}
.code-copy-btn:hover{background:var(--accent-2)}
.toast-stack{position:fixed;bottom:20px;right:20px;display:flex;flex-direction:column-reverse;gap:8px;z-index:9999;pointer-events:none}
.toast{background:var(--bg-2);border:1px solid var(--border);box-shadow:var(--shadow-lg);border-radius:9px;padding:11px 14px;display:flex;align-items:center;gap:9px;font-size:12px;font-weight:600;animation:slideIn .3s ease,fadeOut .3s 2s ease forwards;pointer-events:all}
@keyframes slideIn{from{transform:translateX(20px);opacity:0}to{transform:translateX(0);opacity:1}}
@keyframes fadeOut{to{opacity:0;transform:translateX(20px)}}
@media(max-width:1100px){.workspace{grid-template-columns:280px 1fr 250px}}
@media(max-width:900px){body{overflow:auto;height:auto}.workspace{grid-template-columns:1fr;height:auto}.sidebar,.sidebar-right{border:none;border-bottom:1px solid var(--border)}.stage-canvas{min-height:300px}}
</style>
</head>
<body>
<header class="topbar">
<a href="#" class="brand"><div class="brand-logo"><i class="fa-solid fa-wand-magic-sparkles"></i></div><span>Polish<span class="pro">UI</span></span></a>
<div class="tb-divider"></div>
<span class="tb-info"><i class="fa-solid fa-layer-group"></i> Stroke + Fill Library</span>
<div class="tb-actions">
<button class="btn-ghost" onclick="randomCombo()"><i class="fa-solid fa-dice"></i> Random</button>
<button class="btn-ghost" onclick="saveCombo()"><i class="fa-regular fa-bookmark"></i> Save</button>
<button class="icon-btn" onclick="toggleTheme()" title="Theme"><i class="fa-regular fa-moon" id="themeIcon"></i></button>
</div>
</header>
<div class="workspace">
<aside class="sidebar">
<div class="layer-tabs">
<button class="layer-tab active" data-layer="stroke"><i class="fa-regular fa-square"></i> Stroke</button>
<button class="layer-tab" data-layer="fill"><i class="fa-solid fa-fill-drip"></i> Fill</button>
<button class="layer-tab" data-layer="combos"><i class="fa-solid fa-bookmark"></i> Combos</button>
</div>
<div class="search-wrap">
<i class="fa-solid fa-magnifying-glass search-icon"></i>
<input type="text" class="search-input" id="search-input" placeholder="Search...">
</div>
<div class="cat-strip" id="cat-strip"></div>
<div class="lib-section">
<h4><span id="lib-heading">Items</span> <span class="count" id="lib-count">0</span></h4>
<div class="lib-grid" id="lib-grid"></div>
</div>
</aside>
<main class="main">
<div class="stage-toolbar">
<div class="element-tabs" id="element-tabs">
<button class="elem-tab active" data-element="button"><i class="fa-solid fa-square"></i> Button</button>
<button class="elem-tab" data-element="card"><i class="fa-solid fa-id-card"></i> Card</button>
<button class="elem-tab" data-element="frame"><i class="fa-regular fa-square"></i> Frame</button>
<button class="elem-tab" data-element="panel"><i class="fa-solid fa-window-maximize"></i> Panel</button>
<button class="elem-tab" data-element="badge"><i class="fa-solid fa-certificate"></i> Badge</button>
<button class="elem-tab" data-element="banner"><i class="fa-solid fa-flag"></i> Banner</button>
<button class="elem-tab" data-element="icon"><i class="fa-solid fa-circle"></i> Icon</button>
</div>
<div class="bg-tabs">
<button class="bg-tab active" data-bg="grid" title="Grid"><i class="fa-solid fa-border-all"></i></button>
<button class="bg-tab" data-bg="white" title="White"><i class="fa-regular fa-sun"></i></button>
<button class="bg-tab" data-bg="black" title="Black"><i class="fa-solid fa-moon"></i></button>
<button class="bg-tab" data-bg="game" title="Game"><i class="fa-solid fa-gamepad"></i></button>
<button class="bg-tab" data-bg="anime" title="Anime"><i class="fa-solid fa-star"></i></button>
</div>
</div>
<div class="stage-canvas bg-grid" id="stage-canvas">
<div id="preview-element">
<div class="preview-empty">
<i class="fa-solid fa-layer-group"></i>
<h2>Welcome to PolishUI 2.0</h2>
<div>Pick a STROKE and FILL from the left to combine</div>
</div>
</div>
</div>
</main>
<aside class="sidebar-right">
<div class="layer-stack">
<h3>Active Layers</h3>
<div class="layer-item" id="layer-stroke">
<div class="layer-icon"><i class="fa-regular fa-square"></i></div>
<div class="layer-info"><div class="layer-label">Stroke</div><div class="layer-value" id="stroke-val">None</div></div>
<button class="clear-btn" onclick="clearLayer('stroke')"><i class="fa-solid fa-xmark"></i></button>
</div>
<div class="layer-item" id="layer-fill">
<div class="layer-icon"><i class="fa-solid fa-fill-drip"></i></div>
<div class="layer-info"><div class="layer-label">Fill</div><div class="layer-value" id="fill-val">None</div></div>
<button class="clear-btn" onclick="clearLayer('fill')"><i class="fa-solid fa-xmark"></i></button>
</div>
</div>
<div class="props-section">
<h3>Adjustments</h3>
<div class="prop-row">
<label>Hue</label>
<input type="range" class="hue-bar" id="hue-slider" min="-180" max="180" value="0">
<span class="val" id="hue-val">0°</span>
</div>
<div class="prop-row">
<label>Tint</label>
<input type="color" id="tint-color" value="#3b82f6">
<button class="icon-btn" onclick="resetTint()" style="width:28px;height:24px;font-size:9px;"><i class="fa-solid fa-xmark"></i></button>
</div>
</div>
<div class="export-panel">
<h3 style="font-family:'Space Grotesk',sans-serif;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted);margin-bottom:10px;">Export</h3>
<div class="export-tabs" id="export-tabs">
<button class="export-tab active" data-tab="figma"><i class="fa-brands fa-figma"></i> Figma</button>
<button class="export-tab" data-tab="css"><i class="fa-brands fa-css3-alt"></i> CSS</button>
<button class="export-tab" data-tab="lua"><i class="fa-solid fa-cube"></i> Lua</button>
</div>
<div id="export-body">
<div style="padding:30px 0;text-align:center;color:var(--dim);font-size:11px;">
<i class="fa-solid fa-code" style="display:block;font-size:22px;margin-bottom:8px;opacity:.4;"></i>
Select layers to see code
</div>
</div>
</div>
</aside>
</div>
<div class="toast-stack" id="toast-stack"></div>
<script>
function hslToHex(h,s,l){h=((h%360)+360)%360;l/=100;const a=s*Math.min(l,1-l)/100;const f=n=>{const k=(n+h/30)%12;const c=l-a*Math.max(Math.min(k-3,9-k,1),-1);return Math.round(255*c).toString(16).padStart(2,'0');};return`#${f(0)}${f(8)}${f(4)}`;}
function hslToRgb(h,s,l){h=((h%360)+360)%360;l/=100;const a=s*Math.min(l,1-l)/100;const f=n=>{const k=(n+h/30)%12;const c=l-a*Math.max(Math.min(k-3,9-k,1),-1);return Math.round(255*c);};return{r:f(0),g:f(8),b:f(4)};}
function hexToHsl(hex){hex=hex.replace('#','');let r=parseInt(hex.substr(0,2),16)/255,g=parseInt(hex.substr(2,2),16)/255,b=parseInt(hex.substr(4,2),16)/255;let max=Math.max(r,g,b),min=Math.min(r,g,b);let h,s,l=(max+min)/2;if(max==min){h=s=0;}else{let d=max-min;s=l>0.5?d/(2-max-min):d/(max+min);switch(max){case r:h=(g-b)/d+(g<b?6:0);break;case g:h=(b-r)/d+2;break;case b:h=(r-g)/d+4;break;}h/=6;}return{h:Math.round(h*360),s:Math.round(s*100),l:Math.round(l*100)};}
function shiftH(h){let v=h;if(STATE.tintEnabled&&STATE.tintHue!==null){v=((v-215+STATE.tintHue)%360+360)%360;}return((v+STATE.hueShift)%360+360)%360;}
function hex(h,s,l){return hslToHex(shiftH(h),s,l);}

const FILL_CATEGORIES=[
{id:'all',name:'All',emoji:'🎯'},{id:'solid',name:'Solid',emoji:'⬛'},{id:'metal',name:'Metal',emoji:'⚙️'},{id:'gold',name:'Gold',emoji:'🥇'},{id:'gem',name:'Gem',emoji:'💎'},{id:'rpg',name:'Elements',emoji:'🔥'},{id:'gaming',name:'Gaming',emoji:'🎮'},{id:'cyber',name:'Cyber',emoji:'🚀'},{id:'pastel',name:'Pastel',emoji:'🌸'},{id:'ornate',name:'Ornate',emoji:'👑'},{id:'material',name:'Material',emoji:'🪵'},{id:'glass',name:'Glass',emoji:'🔮'},{id:'mesh',name:'Mesh',emoji:'🎨'},{id:'special',name:'Special',emoji:'🌈'},{id:'modern',name:'Modern',emoji:'✨'}
];

const COMBOS=JSON.parse(localStorage.getItem('polishui-combos')||'[]');

const STATE={currentLayer:'stroke',currentCategory:'all',searchQuery:'',currentElement:'button',exportTab:'figma',hueShift:0,tintHue:null,tintEnabled:false,activeStroke:null,activeFill:null,bg:'grid'};
let favorites=JSON.parse(localStorage.getItem('polishui-favs2')||'[]');

function renderCategories(){
const cats=STATE.currentLayer==='stroke'?STROKE_CATEGORIES:STATE.currentLayer==='fill'?FILL_CATEGORIES:[{id:'all',name:'All',emoji:'🎯'}];
document.getElementById('cat-strip').innerHTML=cats.map(c=>`<button class="cat-chip ${STATE.currentCategory===c.id?'active':''}" onclick="selectCat('${c.id}')">${c.emoji} ${c.name}</button>`).join('');
}
function selectCat(catId){STATE.currentCategory=catId;renderCategories();renderLibrary();}

function getItems(){
let items=STATE.currentLayer==='stroke'?STROKES:STATE.currentLayer==='fill'?FILLS:COMBOS;
if(STATE.currentCategory!=='all'&&STATE.currentLayer!=='combos'){items=items.filter(i=>i.cat===STATE.currentCategory);}
if(STATE.searchQuery){const q=STATE.searchQuery.toLowerCase();items=items.filter(i=>i.name.toLowerCase().includes(q));}
return items;
}

function renderLibrary(){
const items=getItems();
document.getElementById('lib-count').textContent=items.length;
document.getElementById('lib-heading').textContent=STATE.currentLayer==='stroke'?'Strokes':STATE.currentLayer==='fill'?'Fills':'Combos';
const grid=document.getElementById('lib-grid');
if(!items.length){grid.innerHTML=`<div class="empty-state"><i class="fa-regular fa-folder-open"></i>${STATE.currentLayer==='combos'?'No saved combos yet. Pick layers + click Save!':'No items found'}</div>`;return;}
grid.innerHTML=items.map(item=>{
const isActive=(STATE.currentLayer==='stroke'&&STATE.activeStroke===item.id)||(STATE.currentLayer==='fill'&&STATE.activeFill===item.id);
const favKey=`${STATE.currentLayer}:${item.id}`;
const isFav=favorites.includes(favKey);
if(STATE.currentLayer==='combos'){
return `<div class="lib-card" onclick="loadCombo('${item.id}')"><div class="lib-preview"><div class="preview-box" style="background:linear-gradient(135deg,#444,#888);"></div></div><div class="lib-name">${item.name}</div></div>`;
}
return `<div class="lib-card ${isActive?'selected':''}" onclick="selectItem('${item.id}')"><button class="fav-btn ${isFav?'fav-on':''}" onclick="event.stopPropagation();toggleFav('${favKey}')"><i class="fa-${isFav?'solid':'regular'} fa-star"></i></button><div class="lib-preview">${renderCardPreview(item)}</div><div class="lib-name">${item.name}</div></div>`;
}).join('');
}

function renderCardPreview(item){
if(STATE.currentLayer==='stroke'){
if(item.svg){return `<div class="preview-box" style="background:rgba(255,255,255,0.05);">${svgFrameHTML(item.id.replace('sv-',''),62,34,'#c0c0c0','rgba(60,60,80,0.5)')}</div>`;}
const css=item.build(2);const styleStr=Object.entries(css).map(([k,v])=>`${kebab(k)}:${v}`).join(';');
return `<div class="preview-box" style="${styleStr};background:rgba(255,255,255,0.05);"></div>`;
}
const css=item.build();const styleStr=Object.entries(css).map(([k,v])=>`${kebab(k)}:${v}`).join(';');
return `<div class="preview-box" style="${styleStr}"></div>`;
}
function kebab(s){return s.replace(/[A-Z]/g,m=>'-'+m.toLowerCase());}

function svgFrameHTML(type,w,h,stroke,fill){
fill=fill||'rgba(40,40,60,0.85)';
if(type==='spike')return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" style="position:absolute;inset:0;"><polygon points="0,${h/2} ${w*0.15},0 ${w-w*0.15},0 ${w},${h/2} ${w-w*0.15},${h} ${w*0.15},${h}" fill="${fill}" stroke="${stroke}" stroke-width="2"/></svg>`;
if(type==='grunge')return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" style="position:absolute;inset:0;"><path d="M3 5 L${w-5} 3 L${w-3} ${h-4} L5 ${h-3} Z" fill="${fill}" stroke="${stroke}" stroke-width="2" stroke-dasharray="4 1.5"/></svg>`;
if(type==='ornate')return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" style="position:absolute;inset:0;"><rect x="3" y="3" width="${w-6}" height="${h-6}" fill="${fill}" stroke="${stroke}" stroke-width="2"/><rect x="7" y="7" width="${w-14}" height="${h-14}" fill="none" stroke="${stroke}" stroke-width="0.8"/><circle cx="7" cy="7" r="2" fill="${stroke}"/><circle cx="${w-7}" cy="7" r="2" fill="${stroke}"/><circle cx="7" cy="${h-7}" r="2" fill="${stroke}"/><circle cx="${w-7}" cy="${h-7}" r="2" fill="${stroke}"/></svg>`;
if(type==='shield')return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" style="position:absolute;inset:0;"><path d="M${w/2} 2 L${w-2} ${h*0.2} L${w-2} ${h*0.7} L${w/2} ${h-2} L2 ${h*0.7} L2 ${h*0.2} Z" fill="${fill}" stroke="${stroke}" stroke-width="2"/></svg>`;
if(type==='banner')return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" style="position:absolute;inset:0;"><polygon points="0,0 ${w},0 ${w-w*0.12},${h/2} ${w},${h} 0,${h} ${w*0.12},${h/2}" fill="${fill}" stroke="${stroke}" stroke-width="2"/></svg>`;
if(type==='blade')return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" style="position:absolute;inset:0;"><polygon points="0,3 ${w-w*0.15},3 ${w},${h/2} ${w-w*0.15},${h-3} 0,${h-3} ${w*0.15},${h/2}" fill="${fill}" stroke="${stroke}" stroke-width="2"/></svg>`;
return '';
}

function selectItem(itemId){
if(STATE.currentLayer==='stroke')STATE.activeStroke=itemId;
else if(STATE.currentLayer==='fill')STATE.activeFill=itemId;
renderLibrary();applyToPreview();renderLayerStack();renderExport();
}

function clearLayer(layer){
if(layer==='stroke')STATE.activeStroke=null;
else STATE.activeFill=null;
renderLibrary();applyToPreview();renderLayerStack();renderExport();
toast(layer+' cleared','info');
}

function renderLayerStack(){
const stroke=STROKES.find(s=>s.id===STATE.activeStroke);
const fill=FILLS.find(f=>f.id===STATE.activeFill);
document.getElementById('stroke-val').textContent=stroke?stroke.name:'None';
document.getElementById('fill-val').textContent=fill?fill.name:'None';
document.getElementById('layer-stroke').classList.toggle('has-value',!!stroke);
document.getElementById('layer-fill').classList.toggle('has-value',!!fill);
}

function applyToPreview(){
const el=document.getElementById('preview-element');
if(!STATE.activeStroke&&!STATE.activeFill){
el.innerHTML=`<div class="preview-empty"><i class="fa-solid fa-layer-group"></i><h2>Welcome to PolishUI 2.0</h2><div>Pick a STROKE and FILL from the left to combine</div></div>`;
el.style.cssText='';return;
}
const configs={button:{w:'180px',h:'56px',text:'Button',fs:'14px'},card:{w:'260px',h:'320px',text:'Card',fs:'16px'},frame:{w:'340px',h:'200px',text:'Frame',fs:'14px'},panel:{w:'400px',h:'250px',text:'Panel',fs:'15px'},badge:{w:'100px',h:'34px',text:'NEW',fs:'11px'},banner:{w:'320px',h:'60px',text:'BANNER',fs:'14px'},icon:{w:'76px',h:'76px',text:'★',fs:'30px'}};
const cfg=configs[STATE.currentElement];
el.innerHTML='';el.style.cssText='';
el.style.width=cfg.w;el.style.height=cfg.h;el.style.fontSize=cfg.fs;
el.style.display='flex';el.style.alignItems='center';el.style.justifyContent='center';
el.style.color='#fff';el.style.fontWeight='700';el.style.position='relative';el.style.borderRadius='8px';

const stroke=STROKES.find(s=>s.id===STATE.activeStroke);
const fill=FILLS.find(f=>f.id===STATE.activeFill);

if(stroke&&stroke.svg){
el.style.background='transparent';
const type=stroke.id.replace('sv-','');
const w=parseInt(cfg.w),h=parseInt(cfg.h);
let fillCol='rgba(40,40,60,0.85)';
if(fill){
const fc=fill.build();const bg=fc.background||fc.backgroundColor;
if(bg&&!bg.includes('gradient'))fillCol=bg;
else if(bg)fillCol=getFirstColor(bg);
}
el.innerHTML=svgFrameHTML(type,w,h,'#c0c0c0',fillCol);
const textDiv=document.createElement('div');
textDiv.style.cssText='position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:2;';
textDiv.textContent=cfg.text;
el.appendChild(textDiv);
}else{
if(stroke){const css=stroke.build(2);Object.entries(css).forEach(([k,v])=>{if(!k.startsWith('_'))el.style[k]=v;});}
if(fill){const css=fill.build();Object.entries(css).forEach(([k,v])=>{el.style[k]=v;});}
else if(!stroke)el.style.background='rgba(60,60,80,0.85)';
else el.style.background='rgba(60,60,80,0.85)';
el.textContent=cfg.text;
}
}

function getFirstColor(bg){const m=bg.match(/#[0-9a-fA-F]{3,8}|hsla?\([^)]+\)|rgba?\([^)]+\)/g);return m&&m.length?m[0]:'#444';}

document.querySelectorAll('.layer-tab').forEach(btn=>{btn.addEventListener('click',()=>{document.querySelectorAll('.layer-tab').forEach(b=>b.classList.remove('active'));btn.classList.add('active');STATE.currentLayer=btn.dataset.layer;STATE.currentCategory='all';renderCategories();renderLibrary();});});
document.querySelectorAll('.elem-tab').forEach(btn=>{btn.addEventListener('click',()=>{document.querySelectorAll('.elem-tab').forEach(b=>b.classList.remove('active'));btn.classList.add('active');STATE.currentElement=btn.dataset.element;applyToPreview();});});
document.querySelectorAll('.bg-tab').forEach(btn=>{btn.addEventListener('click',()=>{document.querySelectorAll('.bg-tab').forEach(b=>b.classList.remove('active'));btn.classList.add('active');STATE.bg=btn.dataset.bg;const canvas=document.getElementById('stage-canvas');canvas.className='stage-canvas';canvas.classList.add('bg-'+STATE.bg);});});

document.getElementById('hue-slider').addEventListener('input',e=>{STATE.hueShift=parseInt(e.target.value);document.getElementById('hue-val').textContent=STATE.hueShift+'°';renderLibrary();applyToPreview();renderExport();});
document.getElementById('tint-color').addEventListener('input',e=>{STATE.tintHue=hexToHsl(e.target.value).h;STATE.tintEnabled=true;renderLibrary();applyToPreview();renderExport();});
function resetTint(){STATE.tintEnabled=false;STATE.tintHue=null;document.getElementById('tint-color').value='#3b82f6';renderLibrary();applyToPreview();renderExport();}
document.getElementById('search-input').addEventListener('input',e=>{STATE.searchQuery=e.target.value;renderLibrary();});

function toggleFav(key){const i=favorites.indexOf(key);if(i>-1){favorites.splice(i,1);toast('Removed','info');}else{favorites.push(key);toast('Added to favorites','success');}localStorage.setItem('polishui-favs2',JSON.stringify(favorites));renderLibrary();}

function randomCombo(){STATE.activeStroke=STROKES[Math.floor(Math.random()*STROKES.length)].id;STATE.activeFill=FILLS[Math.floor(Math.random()*FILLS.length)].id;renderLibrary();applyToPreview();renderLayerStack();renderExport();toast('🎲 Random combo!','success');}

function saveCombo(){if(!STATE.activeStroke&&!STATE.activeFill){toast('Pick at least one layer first','info');return;}const name=prompt('Combo name:');if(!name)return;COMBOS.push({id:'combo-'+Date.now(),name:name,stroke:STATE.activeStroke,fill:STATE.activeFill});localStorage.setItem('polishui-combos',JSON.stringify(COMBOS));toast('Saved as "'+name+'"','success');}

function loadCombo(comboId){const c=COMBOS.find(x=>x.id===comboId);if(!c)return;STATE.activeStroke=c.stroke;STATE.activeFill=c.fill;applyToPreview();renderLayerStack();renderExport();toast('Loaded "'+c.name+'"','success');}

document.querySelectorAll('.export-tab').forEach(btn=>{btn.addEventListener('click',()=>{document.querySelectorAll('.export-tab').forEach(b=>b.classList.remove('active'));btn.classList.add('active');STATE.exportTab=btn.dataset.tab;renderExport();});});

function renderExport(){
const body=document.getElementById('export-body');
const stroke=STROKES.find(s=>s.id===STATE.activeStroke);
const fill=FILLS.find(f=>f.id===STATE.activeFill);
if(!stroke&&!fill){body.innerHTML=`<div style="padding:30px 0;text-align:center;color:var(--dim);font-size:11px;"><i class="fa-solid fa-code" style="display:block;font-size:22px;margin-bottom:8px;opacity:.4;"></i>Select layers to see code</div>`;return;}
if(STATE.exportTab==='figma')body.innerHTML=renderFigma(stroke,fill);
else if(STATE.exportTab==='css')body.innerHTML=renderCss(stroke,fill);
else body.innerHTML=renderLua(stroke,fill);
}

function renderFigma(stroke,fill){
let html='<div style="display:flex;flex-direction:column;gap:8px;font-size:11px;">';
if(stroke){html+=`<div style="padding:8px;background:var(--bg-3);border-radius:6px;border:1px solid var(--border);"><div style="font-weight:700;color:var(--text);margin-bottom:4px;"><i class="fa-regular fa-square"></i> Stroke: ${stroke.name}</div><div style="color:var(--muted);font-size:10px;">Apply stroke in Figma Effects panel</div></div>`;}
if(fill){const fc=fill.build();const bg=fc.background||fc.backgroundColor||'';const colors=bg.match(/#[0-9a-fA-F]{3,8}/g)||[];html+=`<div style="padding:8px;background:var(--bg-3);border-radius:6px;border:1px solid var(--border);"><div style="font-weight:700;color:var(--text);margin-bottom:6px;"><i class="fa-solid fa-fill-drip"></i> Fill: ${fill.name}</div>${colors.map(c=>`<div style="display:flex;align-items:center;gap:6px;margin-bottom:3px;"><span style="width:14px;height:14px;border-radius:3px;background:${c};border:1px solid var(--border);"></span><span style="font-family:'JetBrains Mono',monospace;font-size:10px;">${c.toUpperCase()}</span></div>`).join('')}</div>`;}
html+=`</div><button class="code-copy-btn" onclick="copyAll('figma')"><i class="fa-solid fa-copy"></i> Copy All Values</button>`;
return html;
}

function renderCss(stroke,fill){
let css='.polish-style {\n';
if(fill){const fc=fill.build();Object.entries(fc).forEach(([k,v])=>{css+=`  ${kebab(k)}: ${v};\n`;});}
if(stroke&&!stroke.svg){const sc=stroke.build(2);Object.entries(sc).forEach(([k,v])=>{if(!k.startsWith('_'))css+=`  ${kebab(k)}: ${v};\n`;});}
if(stroke&&stroke.svg)css+=`  /* SVG stroke: ${stroke.name} - copy SVG separately */\n`;
css+=`  border-radius: 8px;\n}`;
return `<div class="code-block">${highlightCss(css)}</div><button class="code-copy-btn" onclick="copyText(${JSON.stringify(css)})"><i class="fa-solid fa-copy"></i> Copy CSS</button>`;
}

function highlightCss(css){return css.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/([a-z-]+)(\s*):/g,'<span class="k">$1</span>$2:').replace(/(#[0-9a-fA-F]{3,8})/g,'<span class="n">$1</span>').replace(/(rgba?\([^)]+\))/g,'<span class="n">$1</span>').replace(/(\d+(?:\.\d+)?(?:px|%|deg|em|rem)?)/g,'<span class="n">$1</span>');}

function renderLua(stroke,fill){
let lua='-- PolishUI Frame\nlocal frame = Instance.new("Frame")\nframe.Size = UDim2.new(0, 200, 0, 60)\nframe.AnchorPoint = Vector2.new(0.5, 0.5)\nframe.Position = UDim2.new(0.5, 0, 0.5, 0)\n';
if(fill){const fc=fill.build();const bg=fc.background||fc.backgroundColor||'';const colors=bg.match(/#[0-9a-fA-F]{6}/g)||['#666666'];const hex=colors[0].replace('#','');const r=parseInt(hex.substr(0,2),16),g=parseInt(hex.substr(2,2),16),b=parseInt(hex.substr(4,2),16);lua+=`frame.BackgroundColor3 = Color3.fromRGB(${r}, ${g}, ${b})\n`;if(colors.length>=2){lua+='\nlocal gradient = Instance.new("UIGradient")\n';lua+='gradient.Color = ColorSequence.new({\n';colors.slice(0,3).forEach((c,i)=>{const h=c.replace('#','');const r=parseInt(h.substr(0,2),16),g=parseInt(h.substr(2,2),16),b=parseInt(h.substr(4,2),16);const t=(i/(Math.min(colors.length,3)-1)).toFixed(2);lua+=`  ColorSequenceKeypoint.new(${t}, Color3.fromRGB(${r}, ${g}, ${b}))${i<Math.min(colors.length,3)-1?',':''}\n`;});lua+='})\ngradient.Rotation = 90\ngradient.Parent = frame\n';}}
else{lua+='frame.BackgroundColor3 = Color3.fromRGB(100, 100, 100)\n';}
lua+='frame.BorderSizePixel = 0\n\nlocal corner = Instance.new("UICorner")\ncorner.CornerRadius = UDim.new(0, 8)\ncorner.Parent = frame\n';
if(stroke){lua+='\nlocal stroke = Instance.new("UIStroke")\nstroke.Thickness = 2\nstroke.Color = Color3.fromRGB(200, 200, 200)\nstroke.ApplyStrokeMode = Enum.ApplyStrokeMode.Border\nstroke.Parent = frame\n';}
lua+='\nframe.Parent = script.Parent';
return `<div class="code-block">${highlightLua(lua)}</div><button class="code-copy-btn" onclick="copyText(${JSON.stringify(lua)})"><i class="fa-solid fa-copy"></i> Copy Lua</button>`;
}

function highlightLua(code){return code.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/(--[^\n]*)/g,'<span class="c">$1</span>').replace(/\b(local|function|end|if|then|else|return|for|do|while)\b/g,'<span class="p">$1</span>').replace(/\b(Instance|Color3|UDim2|UDim|Vector2|Enum|ColorSequence|ColorSequenceKeypoint)\b/g,'<span class="k">$1</span>').replace(/("[^"]*")/g,'<span class="s">$1</span>').replace(/\b(\d+(?:\.\d+)?)\b/g,'<span class="n">$1</span>');}

function copyText(text){navigator.clipboard.writeText(text).then(()=>toast('Copied!','success'));}
function copyAll(type){const stroke=STROKES.find(s=>s.id===STATE.activeStroke);const fill=FILLS.find(f=>f.id===STATE.activeFill);let t=`═══ POLISHUI COMBO ═══\n\n`;if(stroke)t+=`Stroke: ${stroke.name}\n`;if(fill){t+=`Fill: ${fill.name}\n`;const fc=fill.build();const bg=fc.background||fc.backgroundColor||'';const colors=bg.match(/#[0-9a-fA-F]{3,8}/g)||[];colors.forEach(c=>{t+=`  Color: ${c}\n`;});}navigator.clipboard.writeText(t).then(()=>toast('All copied!','success'));}

function toggleTheme(){const html=document.documentElement;const cur=html.getAttribute('data-theme');const nx=cur==='light'?'dark':'light';html.setAttribute('data-theme',nx);localStorage.setItem('polishui-theme',nx);document.getElementById('themeIcon').className=nx==='light'?'fa-regular fa-moon':'fa-regular fa-sun';}
(function(){const s=localStorage.getItem('polishui-theme');if(s){document.documentElement.setAttribute('data-theme',s);document.getElementById('themeIcon').className=s==='light'?'fa-regular fa-moon':'fa-regular fa-sun';}})();

function toast(msg,type){const stack=document.getElementById('toast-stack');const t=document.createElement('div');t.className='toast';t.innerHTML=`<i class="fa-solid ${type==='success'?'fa-circle-check':'fa-info-circle'}" style="color:${type==='success'?'var(--success)':'var(--accent)'}"></i><span>${msg}</span>`;stack.appendChild(t);setTimeout(()=>t.remove(),2500);}

renderCategories();renderLibrary();renderLayerStack();
</script>
</body>
</html>
